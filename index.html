}

/* ================= backup (standalone) ================= */
function exportData() {
  let raw = null; try { raw = localStorage.getItem('mainline:v1'); } catch {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([raw || '{}'], { type:'application/json' }));
  a.download = `mainline-respaldo-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || typeof d.tasks !== 'object') throw new Error('invalid');
    ['tasks','events','reminders','repos'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
    localStorage.setItem('mainline:v1', JSON.stringify(d));
    location.reload();
  } catch { toast('Ese archivo no es un respaldo válido de Mainline.'); }
}

/* ================= navigation ================= */
function go(view) {
  S.view = view;
  try { history.replaceState(null, '', '#' + view); } catch {}
  render(); window.scrollTo({ top:0 });
}
function openArea(id) {
  const r = getArea(id); if (!r) return;
  S.view = 'area'; S.areaId = id; S.showDoneArea = false;
  try { history.replaceState(null, '', '#area-' + areaKey(r)); } catch {}
  render(); window.scrollTo({ top:0 });
}
function focusSearch() { go('tareas'); setTimeout(() => $('#search')?.focus(), 20); }
const newPreset = () => S.view === 'area' && S.areaId ? { repo:S.areaId } : {};

/* ================= clicks ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (S.armed && act !== 'del-event' && act !== 'del-rem') S.armed = null;
  switch (act) {
    case 'nav': go(t.dataset.v); break;
    case 'search': focusSearch(); break;
    case 'new': openSheet(null, newPreset()); break;
    case 'open': openSheet(id); break;
    case 'toggle': { const k = getTask(id); if (k) setStatus(id, k.status === 'done' ? 'todo' : 'done'); break; }
    case 'move': if (t.dataset.to) setStatus(id, t.dataset.to); break;
    case 'tab': S.tab = t.dataset.v; render(); break;
    case 'see-done': S.tab = 'done'; S.areaFilter = S.boardArea; go('tareas'); break;
    case 'see-no-area': S.tab = 'pending'; S.areaFilter = 'none'; go('tareas'); break;
    case 'open-area': openArea(id); break;
    case 'toggle-done-area': S.showDoneArea = !S.showDoneArea; render(); break;
    case 'new-event': S.showEventForm = true; go('agenda'); setTimeout(() => $('#ev-title')?.focus(), 30); break;
    case 'toggle-event-form': S.showEventForm = !S.showEventForm; render(); if (S.showEventForm) setTimeout(() => $('#ev-title')?.focus(), 30); break;
    case 'toggle-done-rem': S.showDoneRem = !S.showDoneRem; render(); break;
    case 'gcal-allow': gcalAllow(); break;
    case 'rem-toggle': { const r = S.reminders.find(x => x.id === id); if (r) { const n = { ...structuredClone(r), done:!r.done }; upsertLocal('reminders', n); render(); store.put('reminders', n).catch(saveErr); } break; }
    case 'del-event': case 'del-rem': {
      const key = act + ':' + id;
      if (S.armed !== key) { S.armed = key; render(); setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3000); break; }
      S.armed = null;
      const col = act === 'del-event' ? 'events' : 'reminders';
      S[col] = S[col].filter(x => x.id !== id); render(); store.del(col, id).catch(saveErr);
      break;
    }
    // sheet
    case 'close-sheet': closeSheet(); break;
    case 's-status': { const w = S.sheet.work; w.status = t.dataset.v; w.closedAt = w.status === 'done' ? (w.closedAt || Date.now()) : null; sheetChange(true); renderSheet(); break; }
    case 's-prio': S.sheet.work.priority = t.dataset.v || null; sheetChange(true); renderSheet(); break;
    case 's-due': S.sheet.work.due = ymd(addDays(new Date(), +t.dataset.v)); sheetChange(true); renderSheet(); break;
    case 's-due-clear': S.sheet.work.due = null; sheetChange(true); renderSheet(); break;
    case 'sub-toggle': { const c = S.sheet.work.checklist[+t.dataset.i]; c.done = !c.done; sheetChange(true); renderSheet(); break; }
    case 'sub-del': S.sheet.work.checklist.splice(+t.dataset.i, 1); sheetChange(true); renderSheet(); break;
    case 's-delete': {
      if (!S.sheet.armed) { S.sheet.armed = true; renderSheet(); break; }
      const tid = S.sheet.work.id; clearTimeout(sheetTimer); sheetTimer = null;
      S.sheet = null; renderSheet(); deleteTask(tid); toast('Tarea eliminada');
      break;
    }
    case 's-create': {
      const w = S.sheet.work;
      if (!w.title.trim()) { S.sheet.err = 'Escribe qué hay que hacer.'; renderSheet(); $('#s-title')?.focus(); break; }
      const c = createTask(w); S.sheet = null; renderSheet(); toast('Tarea agregada', { label:'Abrir', fn:() => openSheet(c.id) });
      break;
    }
    // settings
    case 'settings': S.settings = { armed:false }; renderModal(); break;
    case 'close-modal': S.settings = null; renderModal(); break;
    case 'export': exportData(); break;
    case 'del-examples': {
      if (!S.settings.armed) { S.settings.armed = true; renderModal(); break; }
      S.settings.armed = false;
      ['tasks', 'events', 'reminders'].forEach(col => { const ex = S[col].filter(x => x.example); S[col] = S[col].filter(x => !x.example); ex.forEach(x => store.del(col, x.id).catch(saveErr)); });
      render(); renderModal(); toast('Datos de ejemplo eliminados');
      break;
    }
    // areas
    case 'new-area': S.areaEdit = { id:null, work:{ name:'', description:'', color:COLORS[S.repos.length % COLORS.length] }, err:'', armed:false }; renderModal(); setTimeout(() => $('#ae-name')?.focus(), 30); break;
    case 'edit-area': { const r = getArea(id); if (!r) break; S.areaEdit = { id, work:{ name:areaName(r), description:r.description || '', color:areaColor(r) }, err:'', armed:false }; renderModal(); break; }
    case 'close-area-edit': S.areaEdit = null; renderModal(); break;
    case 'ae-color': S.areaEdit.work.color = t.dataset.v; renderModal(); break;
    case 'ae-delete': {
      if (!S.areaEdit.armed) { S.areaEdit.armed = true; renderModal(); break; }
      const aid = S.areaEdit.id, r = getArea(aid);
      S.areaEdit = null; renderModal(); if (!r) break;
      S.tasks.filter(x => x.repo === aid).forEach(x => { const n = structuredClone(x); n.repo = null; saveTask(n); });
      S.repos = S.repos.filter(x => x.id !== aid); store.del('repos', aid).catch(saveErr);
      if (S.boardArea === aid) S.boardArea = '';
      if (S.areaFilter === aid) S.areaFilter = '';
      go('areas'); toast(`Área “${areaName(r)}” eliminada. Sus tareas siguen en Tareas, sin área.`);
      break;
    }
  }
});

/* ================= inputs, changes, forms ================= */
let typeTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { S.search = el.value; clearTimeout(typeTimer); typeTimer = setTimeout(render, 120); }
  else if (el.id === 'qa' || el.id === 'qa-area') { if (el.id === 'qa') S.quick = el.value; const h = $('#' + el.id + '-hint'); if (h) h.innerHTML = quickHint(el.value); }
  else if (el.id === 's-title' && S.sheet) { S.sheet.work.title = el.value; if (S.sheet.err && el.value.trim()) S.sheet.err = ''; sheetChange(false); }
  else if (el.id === 's-body' && S.sheet) { S.sheet.work.body = el.value; sheetChange(false); }
  else if (el.id === 'set-name') { clearTimeout(typeTimer); typeTimer = setTimeout(() => saveConfig({ name:el.value.trim() }), 500); }
  else if (el.id === 'ae-name' && S.areaEdit) S.areaEdit.work.name = el.value;
  else if (el.id === 'ae-desc' && S.areaEdit) S.areaEdit.work.description = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'area-filter') { S.areaFilter = el.value; render(); }
  else if (el.id === 'board-area') { S.boardArea = el.value; render(); }
  else if (el.id === 's-due' && S.sheet) { S.sheet.work.due = el.value || null; sheetChange(true); renderSheet(); }
  else if (el.id === 's-area' && S.sheet) { S.sheet.work.repo = el.value || null; sheetChange(true); renderSheet(); }
  else if (el.id === 'imp-file' && el.files && el.files[0]) importData(el.files[0]);
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'quick') {
    const inp = $('#' + f.dataset.input), q = parseQuick(inp.value);
    if (!q.title) { toast('Escribe qué hay que hacer.'); return; }
    if (q.areaMiss) toast(`No hay un área “${q.areaMiss}”. La tarea quedó sin área.`);
    createTask({ title:q.title, priority:q.priority, due:q.due, status:f.dataset.status || 'todo', repo:q.area || f.dataset.area || null });
    if (inp.id === 'qa') S.quick = '';
    inp.value = ''; const h = $('#' + inp.id + '-hint'); if (h) h.innerHTML = quickHint('');
    render(); setTimeout(() => $('#' + inp.id)?.focus(), 0);
  } else if (kind === 'sub') {
    const inp = $('#s-sub'), v = inp.value.trim(); if (!v) return;
    S.sheet.work.checklist.push({ t:v, done:false }); sheetChange(true); renderSheet();
    setTimeout(() => $('#s-sub')?.focus(), 0);
  } else if (kind === 'event') {
    const d = Object.fromEntries(new FormData(f)); if (!d.title.trim()) return;
    const ev = { id:'e_' + rid(), title:d.title.trim(), date:d.date, start:d.start || null, end:d.end || null, location:(d.location || '').trim(), createdAt:Date.now() };
    upsertLocal('events', ev); S.showEventForm = false; render(); store.put('events', ev).catch(saveErr); toast('Evento guardado');
  } else if (kind === 'reminder') {
    const d = Object.fromEntries(new FormData(f)); if (!d.title.trim() || !d.at) return;
    const r = { id:'r_' + rid(), title:d.title.trim(), at:d.at, done:false, createdAt:Date.now() };
    upsertLocal('reminders', r); render(); store.put('reminders', r).catch(saveErr); toast('Recordatorio agregado');
  } else if (kind === 'area') {
    const E = S.areaEdit; if (!E) return;
    const name = E.work.name.trim().replace(/\s+/g, ' ');
    if (!name) { E.err = 'Escribe un nombre para el área.'; renderModal(); $('#ae-name')?.focus(); return; }
    if (S.repos.some(r => areaKey(r) === slugify(name) && r.id !== E.id)) { E.err = `Ya tienes un área llamada “${name}”.`; renderModal(); $('#ae-name')?.focus(); return; }
    const base = E.id ? structuredClone(getArea(E.id)) : { id:'rp_' + rid(), createdAt:Date.now(), topics:[] };
    const area = { ...base, name, slug:slugify(name), description:E.work.description.trim(), color:COLORS.includes(E.work.color) ? E.work.color : 'gray', updatedAt:Date.now() };
    upsertLocal('repos', area); const isNew = !E.id;
    S.areaEdit = null; renderModal(); store.put('repos', area).catch(saveErr);
    if (isNew) { openArea(area.id); toast(`Área “${name}” creada`); }
    else { if (S.view === 'area') { try { history.replaceState(null, '', '#area-' + area.slug); } catch {} } render(); toast('Cambios guardados'); }
  }
});

/* ================= keyboard ================= */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (S.areaEdit) { S.areaEdit = null; renderModal(); return; }
    if (S.settings) { S.settings = null; renderModal(); return; }
    if (S.sheet) { closeSheet(); return; }
    if (typing) e.target.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || S.sheet || S.settings || S.areaEdit) return;
  if (e.key === 'n' || e.key === 'c') { e.preventDefault(); openSheet(null, newPreset()); }
  else if (e.key === '/') { e.preventDefault(); focusSearch(); }
  else if (/^[1-5]$/.test(e.key)) go(VIEWS[+e.key - 1].id);
});

/* ================= drag & drop (board) ================= */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.card'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col'); if (!col) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.col'); if (!col) return; e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setStatus(id, col.dataset.col); });

/* ================= clock, reminders, day change ================= */
let lastDay = today(), lastGreet = greeting(new Date());
const fired = new Set();
function tick() {
  const now = new Date();
  if (today() !== lastDay) { lastDay = today(); render(); startGcalWatch(); }
  else if (greeting(now) !== lastGreet) { lastGreet = greeting(now); render(); }
  S.reminders.forEach(r => {
    if (r.done || fired.has(r.id)) return;
    const at = new Date(r.at);
    if (at <= now && now - at < 6 * 3600e3) {
      fired.add(r.id);
      toast(r.title, { label:'Hecho', fn:() => { const n = { ...structuredClone(r), done:true }; upsertLocal('reminders', n); render(); store.put('reminders', n).catch(saveErr); } }, 'bell');
    } else if (at <= now) fired.add(r.id);
  });
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });

/* ================= boot ================= */
const hash = (location.hash || '').slice(1);
const LEGACY = { resumen:'hoy', issues:'tareas', proyecto:'tablero', repos:'areas' };
if (VIEWS.some(v => v.id === hash)) S.view = hash;
else if (LEGACY[hash]) S.view = LEGACY[hash];
else if (hash.startsWith('area-') || hash.startsWith('repo-')) { S.view = 'area'; S.pendingSlug = hash.slice(5); }
render();

async function boot() {
  const cl = window.claude;
  let db = null, user = null;
  if (!STANDALONE) { try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch {} }
  let owner = false;
  if (user) {
    try { owner = await user.isOwner(); } catch {}
    try { const me = await user.me(); S.profileName = (me.name || '').split(' ')[0]; } catch {}
  }
  store = db && owner ? DbStore(db) : LocalStore();
  S.mode = store.kind;
  let pending = 5;
  const ready = () => { if (--pending === 0) tick(); };
  ['tasks', 'events', 'reminders'].forEach(col => {
    let first = true;
    store.subscribe(col, docs => {
      S[col] = docs;
      if (col === 'tasks' && S.sheet && S.sheet.mode === 'edit' && !getTask(S.sheet.work.id)) { S.sheet = null; renderSheet(); }
      render(); if (first) { first = false; ready(); }
    });
  });
  let firstRepos = true;
  store.subscribe('repos', docs => {
    S.repos = docs; S.reposLoaded = true;
    if (S.pendingSlug) { const r = findArea(S.pendingSlug); if (r) S.areaId = r.id; S.pendingSlug = null; }
    render(); if (firstRepos) { firstRepos = false; ready(); }
  });
  let firstCfg = true;
  store.subscribeConfig(cfg => {
    if (cfg) S.config = { ...cfg, name:cfg.name || '' };
    render(); if (firstCfg) { firstCfg = false; ready(); }
  });
  if (store.kind === 'db') {
    try { mcpNs = await cl.use('mcp'); } catch { mcpNs = null; }
    if (mcpNs) startGcalWatch();
  }
}
boot();
})();
</script>
