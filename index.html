<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mainline: tus tareas, agenda y recordatorios del día en un solo lugar.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231d2127'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Mainline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: one calm centered column (≤720px); text nav on desktop, bottom tab bar on phones; floating add button */
:root{
  --bg:#ffffff; --surface:#f5f6f7; --raised:#ffffff; --line:#eceef1;
  --fg:#1d2127; --muted:#6b737e; --faint:#a3aab4;
  --accent:#3a66db; --accent-soft:#edf1fc;
  --danger:#cf4a3f; --warn:#c27a12; --ok:#2f9e6a;
  --a-blue:#4a78e0; --a-green:#3c9a6a; --a-purple:#8a63d2; --a-orange:#d9792b; --a-red:#d2564b; --a-teal:#2b9a9e; --a-pink:#c95a96; --a-gray:#8a929c;
  --scrim:rgba(18,22,28,.32); --shadow:0 1px 2px rgba(20,26,34,.06),0 6px 20px rgba(20,26,34,.07); --shadow-lg:0 18px 50px rgba(20,26,34,.18);
  --font-ui:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Instrument Serif", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121416; --surface:#1a1d21; --raised:#1f2226; --line:#262a30;
  --fg:#e8eaed; --muted:#9aa2ad; --faint:#646c77;
  --accent:#7d9ff2; --accent-soft:#1c2539;
  --danger:#f06a5f; --warn:#e3a542; --ok:#4cc38a;
  --a-blue:#7d9ff2; --a-green:#5cc48e; --a-purple:#ad8ff0; --a-orange:#f0a15e; --a-red:#f07c72; --a-teal:#55c4c8; --a-pink:#ea86bd; --a-gray:#9aa2ad;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121416; --surface:#1a1d21; --raised:#1f2226; --line:#262a30;
  --fg:#e8eaed; --muted:#9aa2ad; --faint:#646c77;
  --accent:#7d9ff2; --accent-soft:#1c2539;
  --danger:#f06a5f; --warn:#e3a542; --ok:#4cc38a;
  --a-blue:#7d9ff2; --a-green:#5cc48e; --a-purple:#ad8ff0; --a-orange:#f0a15e; --a-red:#f07c72; --a-teal:#55c4c8; --a-pink:#ea86bd; --a-gray:#9aa2ad;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 18px 50px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1080px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top-in{display:flex;align-items:center;gap:20px;height:60px;max-width:1080px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--font-display);font-size:24px;line-height:1;border:0;background:none;padding:0;letter-spacing:-.01em}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button:hover{color:var(--fg);background:var(--surface)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface)}
.top .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:999px;border:0;background:none;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface);color:var(--fg)}

.tabbar{display:none}
@media (max-width:720px){
  .nav{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:4px 0;color:var(--faint);font-size:11px;font-weight:500}
  .tabbar button[aria-current="page"]{color:var(--fg)}
  .tabbar .ico{width:22px;height:22px}
  main{padding-bottom:120px !important}
}

main{padding-block:28px 96px}

/* ---------- typography ---------- */
.hello{font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,7vw,3.4rem);line-height:1.05;letter-spacing:-.015em;margin:12px 0 4px;text-wrap:balance}
.hello em{font-style:italic}
.date{color:var(--muted);margin:0;font-size:15px}
.lede{color:var(--muted);margin:14px 0 0;max-width:52ch;text-wrap:pretty}
.lede b{color:var(--fg);font-weight:600}
.lede .late{color:var(--danger)}
.h1{font-family:var(--font-display);font-weight:400;font-size:clamp(2rem,6vw,2.6rem);line-height:1.1;margin:8px 0 6px;letter-spacing:-.01em;display:flex;align-items:center;gap:12px;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sec-h .n{font-weight:500;color:var(--faint);letter-spacing:0}
.sec-h.late{color:var(--danger)}
.sec-h .right{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.quiet{color:var(--muted);margin:8px 0 0}
.faint{color:var(--faint)}
.textbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.textbtn:hover{text-decoration:underline}
.textbtn.muted{color:var(--muted)}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{background:color-mix(in srgb,var(--fg) 8%,var(--surface))}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.primary:hover{background:color-mix(in srgb,var(--fg) 85%,var(--bg))}
.btn.danger{color:var(--danger);background:none}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:14px}
.field{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.inp{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;width:100%;min-width:0;color:var(--fg)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.55}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 18px,calc(100% - 14px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.row2{display:flex;gap:10px;flex-wrap:wrap}
.row2 > *{flex:1 1 140px;min-width:0}

.add{display:flex;align-items:center;gap:12px;margin-top:28px;padding:0 6px 0 16px;height:52px;border-radius:16px;background:var(--surface);transition:box-shadow .15s,background .15s}
.add:focus-within{background:var(--raised);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.add .plus{color:var(--faint);line-height:0}
.add input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;font-size:16px}
.add input::placeholder{color:var(--faint)}
.add-hint{font-size:13px;color:var(--faint);margin:8px 0 0 16px;min-height:20px}
.add-hint b{color:var(--muted);font-weight:500}

/* ---------- task list ---------- */
.list{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.6px solid var(--faint);background:none;display:grid;place-items:center;padding:0;color:transparent;transition:background .15s,border-color .15s,color .15s}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check .ico{width:13px;height:13px;stroke-width:2.4}
.task.doing .check{border-color:var(--accent);background:linear-gradient(90deg,transparent 50%,var(--accent-soft) 50%)}
.task.prio-alta .check{border-color:var(--danger)}
.task.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.t-main{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:grid;gap:2px}
.t-title{font-size:16px;overflow-wrap:anywhere}
.task.done .t-title{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.t-meta:empty{display:none}
.t-meta .late{color:var(--danger)}
.t-meta .soon{color:var(--warn)}
.t-meta .hi{color:var(--danger);font-weight:500}
.t-meta .doing{color:var(--accent);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac,var(--a-gray));margin-right:6px;vertical-align:1px;flex:none}
.empty{color:var(--muted);padding:14px 4px;margin:0}

/* ---------- timeline ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:start}
.tl li:last-child{border-bottom:0}
.tl .time{color:var(--muted);font-size:14px;padding-top:1px}
.tl .what{min-width:0;overflow-wrap:anywhere}
.tl .what small{display:block;color:var(--muted);font-size:13px}
.tl .past{opacity:.5}
.tl .now .time{color:var(--accent);font-weight:600}
.tl .late .time{color:var(--danger)}
.tl .kind{color:var(--faint);display:inline-flex;vertical-align:-3px;margin-right:6px}
.tl .kind .ico{width:15px;height:15px}
.tiny{border:0;background:none;color:var(--faint);padding:4px;border-radius:8px;line-height:0}
.tiny:hover{color:var(--fg);background:var(--surface)}
.tiny.armed{color:#fff;background:var(--danger);line-height:20px;font-size:13px;padding:2px 8px}
.gc{font-size:13px;color:var(--faint);margin:10px 4px 0}
.gc.warn{color:var(--warn)}

.week{margin-top:36px;padding:18px 20px;border-radius:16px;background:var(--surface)}
.week-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.week-top b{font-weight:600}
.track{height:6px;border-radius:999px;background:color-mix(in srgb,var(--fg) 8%,transparent);overflow:hidden;display:flex;margin-top:10px}
.track span{background:var(--ok)}
.track span.doing{background:var(--accent)}

/* ---------- tasks page ---------- */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.search{flex:1 1 240px;display:flex;align-items:center;gap:10px;height:42px;border-radius:12px;background:var(--surface);padding:0 14px;color:var(--faint);min-width:0}
.search:focus-within{background:var(--raised);box-shadow:0 0 0 1px var(--line),var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg)}
.tools select.inp{flex:0 1 220px;background-color:var(--surface);border-color:transparent}
.seg{display:inline-flex;background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;color:var(--muted);font-weight:500;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start;margin-top:22px}
@media (max-width:860px){
  .board-scroll{overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding-inline:20px;padding-bottom:8px}
  .board{grid-template-columns:repeat(3,min(80vw,300px));width:max-content}
  .col{scroll-snap-align:start}
}
.col{background:var(--surface);border-radius:16px;padding:12px;min-width:0;transition:box-shadow .15s}
.col.over{box-shadow:0 0 0 2px var(--accent)}
.col-h{display:flex;align-items:baseline;gap:8px;padding:2px 4px 10px;font-weight:600}
.col-h .n{color:var(--faint);font-weight:500}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:8px;min-height:24px}
.card{background:var(--raised);border-radius:12px;padding:12px;box-shadow:var(--shadow);display:grid;gap:6px;cursor:grab}
.card.dragging{opacity:.4}
.card .t-main{gap:4px}
.card .t-title{font-size:15px}
.card-move{display:flex;justify-content:flex-end;gap:2px;margin:-4px -6px -6px 0}
.card-move button:disabled{visibility:hidden}
.col-add{margin-top:8px}
.col-add input{width:100%;height:38px;border:0;border-radius:10px;background:transparent;padding:0 10px;outline:none;color:var(--fg)}
.col-add input::placeholder{color:var(--faint)}
.col-add input:focus{background:var(--raised);box-shadow:var(--shadow)}

/* ---------- areas ---------- */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px;margin-top:24px}
.area-card{border:0;background:var(--surface);border-radius:18px;padding:20px;text-align:left;display:grid;gap:8px;align-content:start;transition:transform .15s,box-shadow .15s;min-width:0}
.area-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.area-card .name{display:flex;align-items:center;font-size:18px;font-weight:600;overflow-wrap:anywhere}
.area-card .desc{color:var(--muted);font-size:14px;margin:0;overflow-wrap:anywhere}
.area-card .stats{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-top:6px}
.area-card .stats .late{color:var(--danger)}
.area-card .track span{background:var(--ac)}
.area-card.new{place-content:center;justify-items:center;color:var(--muted);border:1.5px dashed var(--line);background:none;min-height:150px}
.back{border:0;background:none;padding:0;color:var(--muted);display:inline-flex;gap:4px;align-items:center;font-weight:500}
.back:hover{color:var(--fg)}
.h1 .dot{width:14px;height:14px;margin:0}
.collapse{border:0;background:none;padding:10px 4px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.collapse:hover{color:var(--fg)}

/* ---------- agenda ---------- */
.day{margin-top:28px}
.day h3{margin:0 0 4px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.day h3 span{color:var(--muted);font-weight:400}
.formcard{margin-top:20px;padding:18px;border-radius:16px;background:var(--surface);display:grid;gap:12px}
.formcard .inp{background:var(--raised);border-color:transparent}
.formcard .inp:focus{border-color:var(--accent)}

/* ---------- FAB ---------- */
.fab{position:fixed;z-index:24;right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow-lg);transition:transform .15s}
.fab .ico{width:24px;height:24px;stroke-width:2}
.fab:hover{transform:scale(1.04)}
@media (max-width:720px){.fab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* ---------- sheet (task detail) ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;animation:fade .15s ease}
.sheet{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:slide .2s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:720px){.sheet{top:auto;left:0;width:100%;max-height:92%;border-radius:20px 20px 0 0;animation:up .22s ease;padding-left:env(safe-area-inset-left,0px)}}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 12px 0 20px}
.sheet-h .crumb{color:var(--muted);font-size:14px;display:flex;align-items:center;min-width:0}
.sheet-b{flex:1;overflow-y:auto;padding:6px 20px 20px;display:grid;gap:20px;align-content:start}
.title-in{width:100%;border:0;background:none;font-size:24px;font-weight:600;line-height:1.3;padding:4px 0;outline:none;letter-spacing:-.01em}
.title-in::placeholder{color:var(--faint)}
.props{display:grid;gap:2px}
.prop{display:grid;grid-template-columns:88px minmax(0,1fr);gap:12px;align-items:center;min-height:46px}
.prop > span{color:var(--muted);font-size:14px}
.prop .inp{height:38px;background:var(--surface);border-color:transparent}
@media (max-width:520px){.prop{grid-template-columns:minmax(0,1fr);gap:6px;padding:6px 0}.prop > span{font-size:13px}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted);font-weight:500}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip.c-alta[aria-pressed="true"]{background:var(--danger);color:#fff}
.sub-h{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;margin-bottom:4px}
.subs{list-style:none;margin:0;padding:0}
.subs li{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.subs li span{flex:1;min-width:0;overflow-wrap:anywhere}
.subs li.on span{color:var(--faint);text-decoration:line-through}
.subs .check{width:20px;height:20px}
.subs li.on .check{background:var(--ok);border-color:var(--ok);color:#fff}
.sub-add{display:flex;gap:10px;align-items:center;padding-top:6px}
.sub-add input{flex:1;min-width:0;border:0;background:none;outline:none;height:38px}
.sub-add input::placeholder{color:var(--faint)}
.sheet-f{display:flex;gap:10px;align-items:center;padding:12px 20px 14px;border-top:1px solid var(--line)}
.sheet-f .spacer{flex:1}
.err{color:var(--danger);font-size:14px;margin:0}
.meta-line{color:var(--faint);font-size:13px;margin:0}

/* ---------- modal ---------- */
.modal{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--bg);border-radius:20px;box-shadow:var(--shadow-lg);animation:fade .15s ease}
.modal-h{display:flex;align-items:center;padding:16px 12px 4px 22px}
.modal-h h2{margin:0;font-size:20px;font-weight:600;flex:1}
.modal-s{padding:14px 22px;display:grid;gap:12px}
.modal-s + .modal-s{border-top:1px solid var(--line)}
.modal-s h3{margin:0;font-size:14px;font-weight:600}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%;border:3px solid var(--bg);background:var(--ac);padding:0;box-shadow:0 0 0 1px var(--line)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;color:var(--muted)}
kbd{font-family:var(--font-ui);font-size:12px;border-radius:6px;padding:1px 7px;background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.mode{font-size:14px;color:var(--muted)}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
@media (max-width:720px){.toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
.toast{display:flex;align-items:center;gap:12px;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow-lg);animation:up .2s ease;font-size:14px}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:none;color:var(--bg);font-weight:600;padding:0;opacity:.85}
.toast button:hover{opacity:1;text-decoration:underline}
.toast.bell{background:var(--accent);color:#fff}
.toast.bell button{color:#fff}
.skel{height:14px;border-radius:6px;background:var(--surface);margin:16px 4px}
.skel.s{width:55%}

@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script>
(() => {
'use strict';

/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dayDiff = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const hhmm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const L = 'es-MX';
const fDay = new Intl.DateTimeFormat(L, { day:'numeric', month:'short' });
const fWd = new Intl.DateTimeFormat(L, { weekday:'long' });
const fLong = new Intl.DateTimeFormat(L, { weekday:'long', day:'numeric', month:'long' });
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clean = s => s.replace('.', '');
const weekBounds = d => { const dow = (d.getDay() + 6) % 7; const s = addDays(d, -dow); return [ymd(s), ymd(addDays(s, 6))]; };
const today = () => ymd(new Date());
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const STANDALONE = !(window.claude && typeof window.claude.use === 'function');

function ago(ms) {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  if (s < 86400*7) return `hace ${plural(Math.floor(s/86400), 'día', 'días')}`;
  return `el ${fDay.format(new Date(ms))}`;
}
// short, human label for a due date
function dueText(due) {
  const d = dayDiff(due, today());
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d === -1) return 'Ayer';
  if (d < -1) return `Hace ${-d} días`;
  if (d < 7) return cap(fWd.format(parseYmd(due)));
  return clean(fDay.format(parseYmd(due)));
}
function relUntil(date) {
  const m = Math.round((date - Date.now()) / 60000), a = Math.abs(m);
  if (a < 1) return 'ahora';
  const t = a < 60 ? `${a} min` : a < 1440 ? `${Math.round(a/60)} h` : plural(Math.round(a/1440), 'día', 'días');
  return m > 0 ? `en ${t}` : `hace ${t}`;
}

/* ================= icons ================= */
const P = {
  check:'<path d="M5 10.5 8.5 14 15 6.5"/>',
  sun:'<circle cx="10" cy="10" r="3.4"/><path d="M10 2.5v1.6M10 15.9v1.6M17.5 10h-1.6M4.1 10H2.5M15.3 4.7l-1.1 1.1M5.8 14.2l-1.1 1.1M15.3 15.3l-1.1-1.1M5.8 5.8 4.7 4.7"/>',
  list:'<path d="M7.5 5.5h9M7.5 10h9M7.5 14.5h9"/><circle cx="4" cy="5.5" r=".9" fill="currentColor" stroke="none"/><circle cx="4" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="4" cy="14.5" r=".9" fill="currentColor" stroke="none"/>',
  board:'<rect x="3" y="3.5" width="4" height="13" rx="1.2"/><rect x="8.5" y="3.5" width="4" height="9" rx="1.2"/><rect x="14" y="3.5" width="3" height="6" rx="1.2"/>',
  cal:'<rect x="3" y="4" width="14" height="13" rx="2.2"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/>',
  folder:'<path d="M2.8 6.2a1.7 1.7 0 0 1 1.7-1.7h3.2l1.7 1.8h6.1a1.7 1.7 0 0 1 1.7 1.7v6.5a1.7 1.7 0 0 1-1.7 1.7H4.5a1.7 1.7 0 0 1-1.7-1.7Z"/>',
  bell:'<path d="M5 13.5V9a5 5 0 0 1 10 0v4.5l1.2 1.5H3.8Z"/><path d="M8.2 17.2a2 2 0 0 0 3.6 0"/>',
  x:'<path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/>',
  trash:'<path d="M4 6h12M8 6V4.5h4V6M5.8 6l.7 10h7l.7-10"/>',
  left:'<path d="M12 4.5 6.5 10l5.5 5.5"/>',
  right:'<path d="M8 4.5 13.5 10 8 15.5"/>',
  down:'<path d="M5 8l5 5 5-5"/>',
  undo:'<path d="M7 5 3.5 8.5 7 12"/><path d="M3.5 8.5H12a4.5 4.5 0 0 1 0 9h-2"/>',
  ext:'<path d="M11 3.5h5.5V9M16.5 3.5 9.5 10.5M14 11.5V16a.5.5 0 0 1-.5.5H4a.5.5 0 0 1-.5-.5V6.5A.5.5 0 0 1 4 6h4.5"/>',
  plus:'<path d="M10 4v12M4 10h12"/>',
  search:'<circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.6 3.6"/>',
};
const ico = n => `<svg class="ico" viewBox="0 0 20 20" aria-hidden="true">${P[n]}</svg>`;

/* ================= constants ================= */
const COLORS = ['blue','green','purple','orange','red','teal','pink','gray'];
const PRIO_RANK = { alta:0, media:1, baja:2 };
const STATUS = { todo:'Pendiente', doing:'En curso', done:'Hecha' };
const VIEWS = [
  { id:'hoy',     label:'Hoy',     icon:'sun' },
  { id:'tareas',  label:'Tareas',  icon:'list' },
  { id:'tablero', label:'Tablero', icon:'board' },
  { id:'agenda',  label:'Agenda',  icon:'cal' },
  { id:'areas',   label:'Áreas',   icon:'folder' },
];
const DAY_NOTES = [
  'Domingo tranquilo. Buen momento para planear la semana.',
  'Empieza la semana. Elige lo más importante y ve por ello.',
  'Martes: buen día para cerrar pendientes.',
  'Mitad de semana. Revisa qué sigue en tu tablero.',
  'Jueves: atiende lo que vence antes del fin de semana.',
  'Viernes. Termina lo que puedas y descansa.',
  'Sábado. Avanza a tu ritmo, sin presión.',
];
const SPECIAL = {
  '01-01':'Feliz año nuevo.', '02-14':'Feliz 14 de febrero.', '09-16':'¡Viva México!',
  '11-01':'Día de Muertos.', '11-02':'Día de Muertos.', '12-24':'Feliz Nochebuena.', '12-25':'Feliz Navidad.', '12-31':'Último día del año.',
};

/* ================= state ================= */
const S = {
  mode:'loading',
  tasks:[], events:[], reminders:[], repos:[], reposLoaded:false,
  config:{ name:'' }, profileName:'',
  view:'hoy', areaId:null, pendingSlug:null,
  tab:'pending', search:'', areaFilter:'', boardArea:'',
  showEventForm:false, showDoneRem:false, showDoneArea:false,
  sheet:null, settings:null, areaEdit:null,
  gcal:{ status:'off', events:[], storedAt:null, stale:false },
  armed:null, quick:'',
};
let store = null;

/* ================= storage ================= */
const slugify = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]+/g, '-').replace(/-{2,}/g, '-').replace(/^[-.]+|[-.]+$/g, '').slice(0, 40);
function seedData() {
  const base = { tasks:{}, events:{}, reminders:{}, repos:{}, config:null };
  if (!STANDALONE) return base;
  const now = Date.now(), a = (id, name, description, color) => ({ id, name, slug:slugify(name), description, color, topics:[], createdAt:now });
  base.repos = {
    rp_servicio:a('rp_servicio', 'Servicio social', 'Servicio social en IYEM, portal iyem-crea', 'orange'),
    rp_uni:a('rp_uni', 'Universidad', 'Ing. en TI y Negocios Digitales, Anáhuac Mayab', 'blue'),
    rp_proyectos:a('rp_proyectos', 'Proyectos', 'BookStreak, GameFinder y la trivia multijugador', 'purple'),
    rp_personal:a('rp_personal', 'Personal', 'Gym, lecturas y pendientes de casa', 'green'),
  };
  base.config = { name:'Daniel' };
  return base;
}
function LocalStore() {
  const KEY = 'mainline:v1';
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY)); } catch {}
  data = data || seedData();
  ['tasks','events','reminders','repos'].forEach(k => { data[k] ||= {}; });
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  save();
  const emit = c => (subs[c] || []).forEach(cb => cb(c === 'config' ? data.config : Object.values(data[c])));
  return {
    kind:'local',
    subscribe(c, cb) { (subs[c] ||= []).push(cb); queueMicrotask(() => cb(Object.values(data[c]))); },
    subscribeConfig(cb) { (subs.config ||= []).push(cb); queueMicrotask(() => cb(data.config)); },
    async put(c, o) { data[c][o.id] = structuredClone(o); save(); emit(c); },
    async del(c, id) { delete data[c][id]; save(); emit(c); },
    async putConfig(o) { data.config = structuredClone(o); save(); emit('config'); },
  };
}
function DbStore(db) {
  const chains = new Map(); // one write at a time per document
  const serial = (path, op) => {
    const next = (chains.get(path) || Promise.resolve()).catch(() => {}).then(() => withRetry(op));
    chains.set(path, next); return next;
  };
  const onErr = e => { if (e && e.code === 'revoked') toast('Se perdió el acceso a tus datos. Recarga la página.'); };
  return {
    kind:'db',
    subscribe(c, cb) { db.collection(c).onSnapshot(s => cb(s.docs.map(d => ({ ...d.data(), id:d.id }))), onErr); },
    subscribeConfig(cb) { db.doc('config/main').onSnapshot(s => cb(s.exists ? s.data() : null), onErr); },
    put(c, o) { return serial(`${c}/${o.id}`, () => db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)))); },
    del(c, id) { return serial(`${c}/${id}`, () => db.collection(c).doc(id).delete()); },
    putConfig(o) { return serial('config/main', () => db.doc('config/main').set(JSON.parse(JSON.stringify(o)))); },
  };
}
async function withRetry(op) {
  try { return await op(); }
  catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return op(); } throw e; }
}
function saveErr(e) {
  const c = e && e.code;
  toast(c === 'quota_exceeded' ? 'Se llenó el espacio disponible. Borra tareas viejas para liberar espacio.'
    : c === 'invalid_argument' ? 'No se pudo guardar este cambio. Recarga la página e inténtalo de nuevo.'
    : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
}

/* ================= data helpers ================= */
const getTask = id => S.tasks.find(t => t.id === id);
const getArea = id => id ? S.repos.find(r => r.id === id) || null : null;
const areaName = r => r ? (r.name || cap((r.slug || '').replace(/[-_]+/g, ' '))) : '';
const areaColor = r => r && COLORS.includes(r.color) ? r.color : 'gray';
const areaKey = r => slugify(areaName(r));
function findArea(token) {
  const t = slugify(token); if (!t) return null;
  return S.repos.find(r => areaKey(r) === t || r.slug === t) || S.repos.find(r => areaKey(r).startsWith(t) || (r.slug || '').startsWith(t)) || null;
}
const userName = () => (S.config.name || S.profileName || '').trim();
const isOpen = t => t.status !== 'done';

function upsertLocal(col, o) { const a = S[col], i = a.findIndex(x => x.id === o.id); if (i >= 0) a[i] = o; else a.push(o); }
function saveTask(t) { t.updatedAt = Date.now(); upsertLocal('tasks', t); render(); return store.put('tasks', t).catch(saveErr); }
function deleteTask(id) { S.tasks = S.tasks.filter(t => t.id !== id); render(); return store.del('tasks', id).catch(saveErr); }
function setStatus(id, status, undo = true) {
  const t = getTask(id); if (!t || t.status === status) return;
  const prev = t.status, n = structuredClone(t);
  n.status = status; n.closedAt = status === 'done' ? Date.now() : null;
  saveTask(n);
  if (undo) toast(status === 'done' ? 'Tarea completada' : prev === 'done' ? 'Tarea reabierta' : `Movida a ${STATUS[status]}`, { label:'Deshacer', fn:() => setStatus(id, prev, false) });
}
function saveConfig(patch) {
  S.config = { ...S.config, ...patch }; render();
  return store.putConfig({ ...S.config }).catch(saveErr);
}
function createTask(f) {
  const num = S.tasks.reduce((m, t) => Math.max(m, t.num || 0), 0) + 1;
  const t = { id:'t_' + rid(), num, title:f.title.trim(), body:f.body || '', labels:f.labels || [], priority:f.priority || null,
    due:f.due || null, status:f.status || 'todo', checklist:f.checklist || [], repo:f.repo || null,
    createdAt:Date.now(), closedAt:f.status === 'done' ? Date.now() : null };
  saveTask(t); return t;
}

/* ================= quick add ================= */
const WD = { dom:0, domingo:0, lun:1, lunes:1, mar:2, martes:2, mie:3, 'mié':3, miercoles:3, 'miércoles':3, jue:4, jueves:4, vie:5, viernes:5, sab:6, 'sáb':6, sabado:6, 'sábado':6 };
function parseDue(raw) {
  const t = raw.toLowerCase(), now = new Date();
  if (t === 'hoy') return ymd(now);
  if (t === 'mañana' || t === 'manana') return ymd(addDays(now, 1));
  if (t === 'pasado') return ymd(addDays(now, 2));
  if (t in WD) { let d = (WD[t] - now.getDay() + 7) % 7; if (d === 0) d = 7; return ymd(addDays(now, d)); }
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const m = t.match(/^(\d{1,2})\/(\d{1,2})$/);
  if (m) { const d = new Date(now.getFullYear(), +m[2]-1, +m[1]); if (ymd(d) < ymd(now)) d.setFullYear(d.getFullYear()+1); return ymd(d); }
  return null;
}
function parseQuick(str) {
  const out = { words:[], priority:null, due:null, area:null, areaMiss:null };
  for (const tok of str.trim().split(/\s+/)) {
    if (!tok) continue;
    let m, d;
    if ((m = tok.match(/^!(alta|media|baja|1|2|3)$/i))) out.priority = ({ '1':'alta', '2':'media', '3':'baja' })[m[1]] || m[1].toLowerCase();
    else if (tok.startsWith('@') && (d = parseDue(tok.slice(1)))) out.due = d;
    else if (/^\+[\p{L}\p{N}_.-]+$/u.test(tok)) { const a = findArea(tok.slice(1)); if (a) out.area = a.id; else out.areaMiss = tok.slice(1); }
    else out.words.push(tok);
  }
  out.title = out.words.join(' ');
  return out;
}
function quickHint(str) {
  if (!str || !str.trim()) return `Atajos opcionales: <b>@mañana</b> para la fecha, <b>!alta</b> para la prioridad, <b>+universidad</b> para el área.`;
  const q = parseQuick(str), bits = [];
  if (q.area) bits.push(`<span class="dot" style="--ac:var(--a-${areaColor(getArea(q.area))})"></span>${esc(areaName(getArea(q.area)))}`);
  if (q.areaMiss) bits.push(`<span style="color:var(--danger)">No hay un área “${esc(q.areaMiss)}”</span>`);
  if (q.due) bits.push(esc(dueText(q.due)));
  if (q.priority) bits.push(`Prioridad ${q.priority}`);
  return bits.length ? bits.join(' · ') : 'Pulsa Enter para agregarla.';
}

/* ================= grouping & sorting ================= */
const byPrioDue = (a, b) => (PRIO_RANK[a.priority] ?? 3) - (PRIO_RANK[b.priority] ?? 3) || (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt - b.createdAt;
const byDuePrio = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (PRIO_RANK[a.priority] ?? 3) - (PRIO_RANK[b.priority] ?? 3);
const byClosed = (a, b) => (b.closedAt || 0) - (a.closedAt || 0);
function bucketize(tasks) {
  const td = today(), tm = ymd(addDays(new Date(), 1)), [, we] = weekBounds(new Date());
  const B = [['late','Vencidas'],['today','Hoy'],['tomorrow','Mañana'],['week','Esta semana'],['later','Más adelante'],['none','Sin fecha']].map(([k, l]) => ({ k, l, items:[] }));
  const get = k => B.find(b => b.k === k).items;
  tasks.forEach(t => {
    if (!t.due) get('none').push(t);
    else if (t.due < td) get('late').push(t);
    else if (t.due === td) get('today').push(t);
    else if (t.due === tm) get('tomorrow').push(t);
    else if (t.due <= we) get('week').push(t);
    else get('later').push(t);
  });
  B.forEach(b => b.items.sort(b.k === 'none' ? byPrioDue : byDuePrio));
  return B.filter(b => b.items.length);
}

/* ================= events & Google Calendar ================= */
function allEvents() {
  return [...S.events.map(e => ({ ...e, source:'local' })), ...S.gcal.events]
    .sort((a, b) => a.date.localeCompare(b.date) || (a.start || '').localeCompare(b.start || ''));
}
function normGcal(ev) {
  const s = ev.start || {}, e = ev.end || {};
  let date, start = null, end = null, allDay = false;
  if (s.dateTime) { const d = new Date(s.dateTime); date = ymd(d); start = hhmm(d); if (e.dateTime) end = hhmm(new Date(e.dateTime)); }
  else if (s.date) { date = String(s.date).slice(0, 10); allDay = true; }
  else return null;
  return { id:'g_' + ev.id, title:ev.summary || '(Sin título)', date, start, end, allDay, location:ev.location || '', link:ev.htmlLink || '', source:'gcal' };
}
const GC = 'Google Calendar';
let gcalUnwatch = null, mcpNs = null;
const gcalInput = () => { const d = new Date(); return { startTime:ymd(d) + 'T00:00:00', endTime:ymd(addDays(d, 15)) + 'T00:00:00', orderBy:'startTime', pageSize:100 }; };
function applyGcal(result) {
  const p = result && result.payload, list = p && Array.isArray(p.events) ? p.events : [];
  S.gcal.events = list.filter(e => e.status !== 'cancelled').map(normGcal).filter(Boolean);
  S.gcal.status = 'ok'; S.gcal.stale = false; S.gcal.storedAt = result.cache ? result.cache.storedAt : Date.now();
  render();
}
const GC_DENIALS = ['needs_reauth','server_not_connected','selection_required','blocked_by_policy','not_in_manifest','approval_required','server_not_found','not_granted','capability_disabled','capability_removed'];
function gcalError(err) {
  const code = err && err.code;
  if (GC_DENIALS.includes(code)) { S.gcal.events = []; S.gcal.status = code; }
  else { S.gcal.stale = true; if (S.gcal.status !== 'ok') S.gcal.status = 'error'; }
  render();
}
function startGcalWatch() {
  if (!mcpNs) return;
  if (gcalUnwatch) gcalUnwatch();
  if (S.gcal.status !== 'ok') S.gcal.status = 'loading';
  gcalUnwatch = mcpNs.watchTool(GC, 'list_events', gcalInput(), ev => ev.type === 'data' ? applyGcal(ev.result) : gcalError(ev.error), { refetchInterval:5 * 60 * 1000 });
}
async function gcalAllow() {
  if (!mcpNs) return;
  S.gcal.status = 'loading'; render();
  try { applyGcal(await mcpNs.callTool(GC, 'list_events', gcalInput())); startGcalWatch(); } catch (e) { gcalError(e); }
}
function gcalLine() {
  const g = S.gcal;
  const connect = 'Conecta Google Calendar en claude.ai (Ajustes → Conectores) para ver tus eventos aquí.';
  const m = {
    loading:'Cargando Google Calendar…',
    ok:g.stale ? 'Google Calendar no se pudo actualizar; mostrando lo último.' : `Incluye Google Calendar · actualizado ${ago(g.storedAt)}`,
    approval_required:'Tus eventos de Google Calendar pueden aparecer aquí. <button class="textbtn" data-act="gcal-allow">Mostrarlos</button>',
    needs_reauth:'Vuelve a conectar Google Calendar en claude.ai: Ajustes → Conectores.',
    server_not_connected:connect, server_not_found:connect,
    selection_required:'Elige qué cuenta de Google Calendar usar cuando claude.ai te lo pida.',
    blocked_by_policy:'Tu organización no permite Google Calendar aquí.',
    not_in_manifest:'Google Calendar está desactivado para esta página. Actívalo desde el menú de permisos.',
    error:'No se pudo cargar Google Calendar. Se reintentará en unos minutos.',
  }[g.status];
  return m ? `<p class="gc ${g.stale || g.status === 'error' || g.status === 'needs_reauth' ? 'warn' : ''}">${m}</p>` : '';
}

/* ================= toasts ================= */
function toast(msg, action, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = '<span></span>';
  el.querySelector('span').textContent = msg;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'bell' ? 20000 : 4500);
}

/* ================= render core ================= */
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.id;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch {}
  fn();
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { n.focus({ preventScroll:true }); try { if (s != null) n.setSelectionRange(s, e); } catch {} } }
}
function render() { keepFocus(() => { renderNav(); renderView(); }); }
function renderNav() {
  const cur = S.view === 'area' ? 'areas' : S.view;
  $('#nav').innerHTML = VIEWS.map(v => `<button data-act="nav" data-v="${v.id}" ${cur === v.id ? 'aria-current="page"' : ''}>${v.label}</button>`).join('');
  $('#tabbar').innerHTML = VIEWS.map(v => `<button data-act="nav" data-v="${v.id}" ${cur === v.id ? 'aria-current="page"' : ''}>${ico(v.icon)}<span>${v.label}</span></button>`).join('');
}
function renderView() {
  const v = $('#view');
  v.className = 'wrap' + (S.view === 'tablero' || S.view === 'areas' ? ' wide' : '');
  v.innerHTML = { hoy:viewHoy, tareas:viewTareas, tablero:viewTablero, agenda:viewAgenda, areas:viewAreas, area:viewArea }[S.view]();
}
const loading = () => S.mode === 'loading';
const skeleton = () => `<div class="skel"></div><div class="skel s"></div><div class="skel"></div>`;

/* ---------- task row ---------- */
function taskMeta(t, o = {}) {
  const td = today(), a = o.hideArea ? null : getArea(t.repo), meta = [];
  if (t.status === 'doing') meta.push('<span class="doing">En curso</span>');
  if (t.priority === 'alta' && t.status !== 'done') meta.push('<span class="hi">Alta</span>');
  if (a) meta.push(`<span><span class="dot" style="--ac:var(--a-${areaColor(a)})"></span>${esc(areaName(a))}</span>`);
  if (t.due && !o.hideDue && t.status !== 'done') meta.push(`<span class="${t.due < td ? 'late' : t.due === td ? 'soon' : ''}">${esc(dueText(t.due))}</span>`);
  if (t.status === 'done' && t.closedAt && !o.board) meta.push(`<span>Hecha ${esc(ago(t.closedAt))}</span>`);
  const ck = t.checklist || [];
  if (ck.length) meta.push(`<span>${ck.filter(c => c.done).length}/${ck.length} subtareas</span>`);
  return meta.join('');
}
function taskRow(t, o = {}) {
  const cls = ['task', t.status === 'done' ? 'done' : '', t.status === 'doing' ? 'doing' : '', t.priority === 'alta' ? 'prio-alta' : ''].join(' ');
  return `<li class="${cls}">
    <button class="check" data-act="toggle" data-id="${t.id}" aria-label="${t.status === 'done' ? 'Marcar como pendiente' : 'Completar'}: ${esc(t.title)}">${ico('check')}</button>
    <button class="t-main" data-act="open" data-id="${t.id}"><span class="t-title">${esc(t.title)}</span><span class="t-meta">${taskMeta(t, o)}</span></button>
  </li>`;
}
const listHtml = (items, o = {}) => `<ul class="list">${items.map(t => taskRow(t, o)).join('')}</ul>`;
function groupsHtml(tasks, o = {}) {
  return bucketize(tasks).map(b => `<section class="sec" style="margin-top:28px"><h2 class="sec-h ${b.k === 'late' ? 'late' : ''}">${b.l}<span class="n">${b.items.length}</span></h2>${listHtml(b.items, { ...o, hideDue:b.k === 'today' || b.k === 'tomorrow' })}</section>`).join('');
}
function addBar(id, placeholder, area) {
  return `<form class="add" data-form="quick" data-input="${id}" data-area="${area || ''}">
      <span class="plus">${ico('plus')}</span>
      <input id="${id}" autocomplete="off" placeholder="${placeholder}" aria-label="Agregar tarea" value="${id === 'qa' ? esc(S.quick) : ''}">
    </form>
    <p class="add-hint" id="${id}-hint">${quickHint(id === 'qa' ? S.quick : '')}</p>`;
}

/* ---------- Hoy ---------- */
function greeting(d) { const h = d.getHours(); return h < 5 ? 'Sigues despierto' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
function viewHoy() {
  const now = new Date(), td = ymd(now), nm = userName().split(' ')[0];
  const open = S.tasks.filter(isOpen);
  const late = open.filter(t => t.due && t.due < td).sort(byDuePrio);
  const forToday = open.filter(t => t.due === td || (t.status === 'doing' && !(t.due && t.due < td))).sort(byPrioDue);
  const events = allEvents().filter(e => e.date === td);
  const rems = S.reminders.filter(r => !r.done && r.at.slice(0, 10) <= td);
  const note = SPECIAL[`${pad(now.getMonth()+1)}-${pad(now.getDate())}`] || DAY_NOTES[now.getDay()];

  let lede = note;
  if (!loading()) {
    const parts = [];
    if (forToday.length) parts.push(`<b>${plural(forToday.length, 'tarea', 'tareas')}</b> para hoy`);
    if (late.length) parts.push(`<b class="late">${plural(late.length, 'vencida', 'vencidas')}</b>`);
    if (events.length) parts.push(`<b>${plural(events.length, 'evento', 'eventos')}</b>`);
    if (parts.length) lede = `Tienes ${parts.join(', ').replace(/, ([^,]*)$/, ' y $1')}. ${note}`;
    else if (open.length) lede = `Nada vence hoy. ${note}`;
  }
  const next = open.filter(t => t.due && t.due > td).sort(byDuePrio)[0];

  const nowT = hhmm(now);
  const tl = [
    ...events.map(e => ({ kind:'event', time:e.allDay || !e.start ? '' : e.start, e })),
    ...rems.map(r => ({ kind:'rem', time:r.at.slice(0, 10) < td ? '' : r.at.slice(11, 16), r, late:new Date(r.at) < now })),
  ].sort((a, b) => (a.time || '00:00').localeCompare(b.time || '00:00'));

  const [ws, we] = weekBounds(now);
  const wk = S.tasks.filter(t => t.due && t.due >= ws && t.due <= we);
  const wkDone = wk.filter(t => t.status === 'done').length, wkDoing = wk.filter(t => t.status === 'doing').length;

  return `
  <p class="date">${esc(cap(fLong.format(now)))}</p>
  <h1 class="hello">${greeting(now)}${nm ? `, <em>${esc(nm)}</em>` : ''}</h1>
  <p class="lede">${lede}</p>
  ${addBar('qa', 'Agregar una tarea…')}
  ${loading() ? skeleton() : `
  ${late.length ? `<section class="sec"><h2 class="sec-h late">Vencidas<span class="n">${late.length}</span></h2>${listHtml(late)}</section>` : ''}
  <section class="sec"><h2 class="sec-h">Hoy<span class="n">${forToday.length || ''}</span></h2>
    ${forToday.length ? listHtml(forToday, { hideDue:true }) : `<p class="empty">Nada pendiente para hoy.${next ? ` Lo siguiente: <b>${esc(next.title)}</b> (${esc(dueText(next.due).toLowerCase())}).` : ''}</p>`}
  </section>
  <section class="sec"><h2 class="sec-h">Agenda<span class="right"><button class="textbtn muted" data-act="new-event">Agregar evento</button></span></h2>
    ${tl.length ? `<ul class="tl">${tl.map(x => x.kind === 'event' ? tlEvent(x.e, nowT) : tlRem(x.r, x.late)).join('')}</ul>` : `<p class="empty">Sin eventos ni recordatorios hoy.</p>`}
    ${gcalLine()}
  </section>
  ${wk.length ? `<div class="week"><div class="week-top"><b>Esta semana</b><span class="faint">${wkDone} de ${wk.length} hechas</span></div><div class="track" role="img" aria-label="${wkDone} de ${wk.length} tareas de la semana hechas"><span style="width:${wkDone / wk.length * 100}%"></span><span class="doing" style="width:${wkDoing / wk.length * 100}%"></span></div></div>` : ''}
  `}`;
}
function tlEvent(e, nowT) {
  const isToday = e.date === today();
  const live = isToday && e.start && e.start <= nowT && e.end && e.end > nowT;
  const past = isToday && e.end && e.end <= nowT;
  const time = e.allDay || !e.start ? 'Todo el día' : e.start;
  const sub = [e.end && e.start ? `hasta ${e.end}` : '', e.location, e.source === 'gcal' ? 'Google Calendar' : ''].filter(Boolean).join(' · ');
  const action = e.source === 'gcal' ? (e.link ? `<a class="tiny" href="${esc(e.link)}" target="_blank" rel="noopener" aria-label="Abrir en Google Calendar">${ico('ext')}</a>` : '<span></span>') : delBtn('del-event', e.id, 'Eliminar evento');
  return `<li class="${live ? 'now' : past ? 'past' : ''}"><span class="time">${live ? 'Ahora' : esc(time)}</span><span class="what">${esc(e.title)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>${action}</li>`;
}
function tlRem(r, late) {
  const at = new Date(r.at);
  const time = r.at.slice(0, 10) === today() ? hhmm(at) : clean(fDay.format(at));
  return `<li class="${late ? 'late' : ''}"><span class="time">${esc(time)}</span><span class="what"><span class="kind">${ico('bell')}</span>${esc(r.title)}<small>${late ? 'Vencido ' + relUntil(at) : relUntil(at)}</small></span><button class="tiny" data-act="rem-toggle" data-id="${r.id}" aria-label="Marcar recordatorio como hecho">${ico('check')}</button></li>`;
}
function delBtn(act, id, label) {
  const armed = S.armed === act + ':' + id;
  return `<button class="tiny ${armed ? 'armed' : ''}" data-act="${act}" data-id="${id}" aria-label="${label}">${armed ? 'Eliminar' : ico('trash')}</button>`;
}

/* ---------- Tareas ---------- */
function filtered() {
  const q = S.search.trim().toLowerCase();
  return S.tasks.filter(t => {
    if (S.areaFilter === 'none' ? t.repo : S.areaFilter && t.repo !== S.areaFilter) return false;
    if (q && !`${t.title} ${t.body || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}
function areaOptions(sel, withNone) {
  return `<option value="">Todas las áreas</option>${S.repos.map(r => `<option value="${r.id}" ${sel === r.id ? 'selected' : ''}>${esc(areaName(r))}</option>`).join('')}${withNone ? `<option value="none" ${sel === 'none' ? 'selected' : ''}>Sin área</option>` : ''}`;
}
function viewTareas() {
  const all = filtered(), open = all.filter(isOpen), done = all.filter(t => !isOpen(t)).sort(byClosed);
  const list = S.tab === 'done' ? done : open;
  return `
  <h1 class="h1">Tareas</h1>
  <p class="sub">${loading() ? 'Cargando…' : plural(S.tasks.filter(isOpen).length, 'pendiente', 'pendientes')}</p>
  <div class="tools">
    <label class="search">${ico('search')}<input id="search" value="${esc(S.search)}" placeholder="Buscar" autocomplete="off" aria-label="Buscar tareas"></label>
    <select class="inp" id="area-filter" aria-label="Área">${areaOptions(S.areaFilter, true)}</select>
  </div>
  <div style="margin-top:16px"><div class="seg" role="group" aria-label="Mostrar"><button data-act="tab" data-v="pending" aria-pressed="${S.tab === 'pending'}">Pendientes ${open.length}</button><button data-act="tab" data-v="done" aria-pressed="${S.tab === 'done'}">Hechas ${done.length}</button></div></div>
  ${loading() ? skeleton() : !list.length ? `<p class="empty" style="margin-top:24px">${S.search || S.areaFilter ? 'Nada coincide con la búsqueda.' : S.tab === 'done' ? 'Aún no has completado tareas.' : 'No tienes pendientes. Agrega una con el botón +.'}</p>`
    : S.tab === 'done' ? `<div style="margin-top:20px">${listHtml(done.slice(0, 80))}</div>` : groupsHtml(open)}`;
}

/* ---------- Tablero ---------- */
function viewTablero() {
  const cols = [['todo', 'Pendiente'], ['doing', 'En curso'], ['done', 'Hecha']];
  const inScope = t => !S.boardArea || t.repo === S.boardArea;
  return `
  <h1 class="h1">Tablero</h1>
  <div class="tools" style="margin-top:10px"><select class="inp" id="board-area" aria-label="Área">${areaOptions(S.boardArea, false)}</select></div>
  <div class="board-scroll"><div class="board">
  ${cols.map(([k, name], ci) => {
    let items = S.tasks.filter(t => t.status === k && inScope(t));
    const total = items.length;
    items.sort(k === 'done' ? byClosed : byPrioDue);
    if (k === 'done') items = items.slice(0, 10);
    return `<section class="col" data-col="${k}" aria-label="${name}">
      <div class="col-h">${name}<span class="n">${total || ''}</span></div>
      <ul class="cards">${loading() ? '' : items.map(t => card(t, ci)).join('')}</ul>
      ${k === 'done' && total > 10 ? `<button class="textbtn muted" style="margin:10px 4px 0" data-act="see-done">Ver todas</button>` : ''}
      ${k !== 'done' ? `<form class="col-add" data-form="quick" data-input="qa-${k}" data-status="${k}" data-area="${S.boardArea}"><input id="qa-${k}" autocomplete="off" placeholder="+ Agregar" aria-label="Agregar tarea a ${name}"></form>` : ''}
    </section>`;
  }).join('')}
  </div></div>`;
}
function card(t, ci) {
  const order = ['todo', 'doing', 'done'];
  return `<li class="card" draggable="true" data-id="${t.id}">
    <button class="t-main" data-act="open" data-id="${t.id}"><span class="t-title">${esc(t.title)}</span><span class="t-meta">${taskMeta({ ...t, status:t.status === 'doing' ? 'todo' : t.status }, { board:true })}</span></button>
    <div class="card-move">
      <button class="tiny" data-act="move" data-id="${t.id}" data-to="${order[ci - 1] || ''}" ${ci === 0 ? 'disabled' : ''} aria-label="Mover a ${STATUS[order[ci - 1]] || ''}">${ico('left')}</button>
      <button class="tiny" data-act="move" data-id="${t.id}" data-to="${order[ci + 1] || ''}" ${ci === 2 ? 'disabled' : ''} aria-label="Mover a ${STATUS[order[ci + 1]] || ''}">${ico('right')}</button>
    </div></li>`;
}

/* ---------- Agenda ---------- */
function viewAgenda() {
  const now = new Date(), td = ymd(now), until = ymd(addDays(now, 14));
  const evs = allEvents().filter(e => e.date >= td && e.date <= until);
  const groups = {}; evs.forEach(e => (groups[e.date] ||= []).push(e));
  const dayName = k => { const d = dayDiff(k, td); return d === 0 ? 'Hoy' : d === 1 ? 'Mañana' : cap(fWd.format(parseYmd(k))); };
  const def = new Date(Date.now() + 3600e3); def.setMinutes(0, 0, 0);
  const pend = S.reminders.filter(r => !r.done).sort((a, b) => a.at.localeCompare(b.at));
  const done = S.reminders.filter(r => r.done).sort((a, b) => b.at.localeCompare(a.at));
  const nowT = hhmm(now);
  return `
  <h1 class="h1">Agenda</h1>
  <p class="sub">Próximos 14 días</p>
  <div style="margin-top:18px"><button class="btn ${S.showEventForm ? '' : 'primary'}" data-act="toggle-event-form">${S.showEventForm ? 'Cancelar' : 'Nuevo evento'}</button></div>
  ${S.showEventForm ? `<form class="formcard" data-form="event">
    <input class="inp" id="ev-title" name="title" required maxlength="140" placeholder="Nombre del evento" aria-label="Nombre del evento">
    <div class="row2">
      <label class="field">Fecha<input class="inp" id="ev-date" name="date" type="date" required value="${td}"></label>
      <label class="field">Empieza<input class="inp" id="ev-start" name="start" type="time"></label>
      <label class="field">Termina<input class="inp" id="ev-end" name="end" type="time"></label>
    </div>
    <input class="inp" id="ev-loc" name="location" maxlength="120" placeholder="Lugar (opcional)" aria-label="Lugar">
    <div><button class="btn primary" type="submit">Guardar evento</button></div>
  </form>` : ''}
  ${loading() ? skeleton() : evs.length ? Object.keys(groups).map(k => `<section class="day"><h3>${esc(dayName(k))} <span>${esc(clean(fDay.format(parseYmd(k))))}</span></h3><ul class="tl">${groups[k].map(e => tlEvent(e, k === td ? nowT : '')).join('')}</ul></section>`).join('')
    : `<p class="empty" style="margin-top:20px">No hay eventos en los próximos 14 días.</p>`}
  ${gcalLine()}

  <section class="sec" style="margin-top:48px"><h2 class="sec-h">Recordatorios<span class="n">${pend.length || ''}</span></h2>
    <form class="formcard" data-form="reminder" style="margin-top:10px">
      <input class="inp" id="rem-title" name="title" required maxlength="140" placeholder="Recordarme…" aria-label="Texto del recordatorio">
      <div class="row2"><input class="inp" id="rem-at" name="at" type="datetime-local" required value="${ymd(def)}T${hhmm(def)}" aria-label="Fecha y hora"><button class="btn primary" type="submit" style="flex:0 0 auto">Agregar</button></div>
    </form>
    ${pend.length ? `<ul class="tl" style="margin-top:8px">${pend.map(remRow).join('')}</ul>` : `<p class="empty">Sin recordatorios pendientes. Te avisaré aquí mientras tengas la página abierta.</p>`}
    ${done.length ? `<button class="collapse" data-act="toggle-done-rem">${ico(S.showDoneRem ? 'down' : 'right')}${plural(done.length, 'completado', 'completados')}</button>${S.showDoneRem ? `<ul class="tl">${done.map(remRow).join('')}</ul>` : ''}` : ''}
  </section>`;
}
function remRow(r) {
  const at = new Date(r.at), late = !r.done && at < new Date();
  return `<li class="${late ? 'late' : r.done ? 'past' : ''}"><span class="time">${esc(clean(fDay.format(at)))}<br>${hhmm(at)}</span><span class="what">${esc(r.title)}<small>${r.done ? 'Hecho' : late ? 'Vencido ' + relUntil(at) : relUntil(at)}</small></span>
    <span style="display:flex;gap:2px"><button class="tiny" data-act="rem-toggle" data-id="${r.id}" aria-label="${r.done ? 'Marcar pendiente' : 'Marcar hecho'}">${ico(r.done ? 'undo' : 'check')}</button>${delBtn('del-rem', r.id, 'Eliminar recordatorio')}</span></li>`;
}

/* ---------- Áreas ---------- */
function areaStats(id) {
  const ts = S.tasks.filter(t => t.repo === id), open = ts.filter(isOpen), td = today();
  return { total:ts.length, open:open.length, done:ts.length - open.length, late:open.filter(t => t.due && t.due < td).length };
}
function viewAreas() {
  const loose = S.tasks.filter(t => isOpen(t) && !t.repo).length;
  return `
  <h1 class="h1">Áreas</h1>
  <p class="sub">Agrupa tus tareas por parte de tu vida.</p>
  ${loading() || !S.reposLoaded ? skeleton() : `<div class="areas">
    ${S.repos.slice().sort((a, b) => areaName(a).localeCompare(areaName(b))).map(r => {
      const st = areaStats(r.id);
      return `<button class="area-card" data-act="open-area" data-id="${r.id}" style="--ac:var(--a-${areaColor(r)})">
        <span class="name"><span class="dot"></span>${esc(areaName(r))}</span>
        ${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}
        <span class="stats"><span>${st.open ? plural(st.open, 'pendiente', 'pendientes') : 'Al día'}${st.late ? ` · <span class="late">${plural(st.late, 'vencida', 'vencidas')}</span>` : ''}</span><span>${st.total ? Math.round(st.done / st.total * 100) + '%' : ''}</span></span>
        <span class="track"><span style="width:${st.total ? st.done / st.total * 100 : 0}%"></span></span>
      </button>`;
    }).join('')}
    <button class="area-card new" data-act="new-area">${ico('plus')}<span>Nueva área</span></button>
  </div>
  ${loose ? `<p class="quiet" style="margin-top:20px">${plural(loose, 'tarea pendiente', 'tareas pendientes')} sin área. <button class="textbtn" data-act="see-no-area">Verlas</button></p>` : ''}`}`;
}
function viewArea() {
  const r = getArea(S.areaId);
  if (!r) return loading() || !S.reposLoaded ? skeleton() : `<p class="empty">Esta área ya no existe. <button class="textbtn" data-act="nav" data-v="areas">Ver áreas</button></p>`;
  const ts = S.tasks.filter(t => t.repo === r.id), open = ts.filter(isOpen), done = ts.filter(t => !isOpen(t)).sort(byClosed);
  const st = areaStats(r.id);
  return `
  <button class="back" data-act="nav" data-v="areas">${ico('left')}Áreas</button>
  <h1 class="h1" style="--ac:var(--a-${areaColor(r)})"><span class="dot"></span>${esc(areaName(r))}</h1>
  <p class="sub">${r.description ? esc(r.description) + ' · ' : ''}${st.open ? plural(st.open, 'pendiente', 'pendientes') : 'Al día'} · <button class="textbtn" data-act="edit-area" data-id="${r.id}">Editar</button></p>
  ${addBar('qa-area', `Agregar a ${esc(areaName(r))}…`, r.id)}
  ${open.length ? groupsHtml(open, { hideArea:true }) : `<p class="empty" style="margin-top:20px">No hay pendientes en esta área.</p>`}
  ${done.length ? `<section class="sec" style="margin-top:28px"><button class="collapse" data-act="toggle-done-area">${ico(S.showDoneArea ? 'down' : 'right')}${plural(done.length, 'hecha', 'hechas')}</button>${S.showDoneArea ? listHtml(done.slice(0, 50), { hideArea:true }) : ''}</section>` : ''}`;
}

/* ================= task sheet ================= */
function openSheet(id, preset = {}) {
  if (id) { const t = getTask(id); if (!t) return; S.sheet = { mode:'edit', work:structuredClone(t), err:'', armed:false }; }
  else S.sheet = { mode:'create', work:{ title:'', body:'', labels:[], priority:null, due:null, status:'todo', checklist:[], repo:null, ...preset }, err:'', armed:false };
  renderSheet();
  if (!id) setTimeout(() => $('#s-title')?.focus(), 40);
}
let sheetTimer = null;
function commitSheet() { const w = S.sheet.work; if (w.title.trim()) saveTask(structuredClone(w)); }
function sheetChange(now) {
  if (!S.sheet || S.sheet.mode !== 'edit') return;
  clearTimeout(sheetTimer); sheetTimer = null;
  if (now) commitSheet(); else sheetTimer = setTimeout(() => { sheetTimer = null; commitSheet(); }, 500);
}
function closeSheet() {
  if (sheetTimer) { clearTimeout(sheetTimer); sheetTimer = null; if (S.sheet && S.sheet.mode === 'edit') commitSheet(); }
  S.sheet = null; renderSheet();
}
function renderSheet() {
  const root = $('#sheet-root');
  if (!S.sheet) { root.innerHTML = ''; if (!S.settings && !S.areaEdit) document.body.classList.remove('lock'); return; }
  document.body.classList.add('lock');
  const D = S.sheet, w = D.work, edit = D.mode === 'edit', a = getArea(w.repo);
  const ckDone = w.checklist.filter(c => c.done).length;
  keepFocus(() => {
    root.innerHTML = `<div class="scrim" data-act="close-sheet"></div>
    <aside class="sheet" role="dialog" aria-modal="true" aria-label="${edit ? 'Detalle de la tarea' : 'Nueva tarea'}">
      <div class="sheet-h"><span class="crumb">${a ? `<span class="dot" style="--ac:var(--a-${areaColor(a)})"></span>${esc(areaName(a))}` : edit ? 'Sin área' : 'Nueva tarea'}</span><span style="flex:1"></span><button class="iconbtn" data-act="close-sheet" aria-label="Cerrar">${ico('x')}</button></div>
      <div class="sheet-b">
        <div>
          <input class="title-in" id="s-title" value="${esc(w.title)}" placeholder="¿Qué hay que hacer?" aria-label="Título" maxlength="200" autocomplete="off">
          ${D.err ? `<p class="err">${esc(D.err)}</p>` : ''}
          ${edit ? `<p class="meta-line">Creada ${esc(ago(w.createdAt))}${w.closedAt ? ` · hecha ${esc(ago(w.closedAt))}` : ''}${w.example ? ' · ejemplo' : ''}</p>` : ''}
        </div>
        <div class="props">
          <div class="prop"><span>Estado</span><div class="chips">${['todo', 'doing', 'done'].map(s => `<button class="chip" data-act="s-status" data-v="${s}" aria-pressed="${w.status === s}">${STATUS[s]}</button>`).join('')}</div></div>
          <div class="prop"><span>Fecha</span><div class="chips"><input class="inp" type="date" id="s-due" value="${w.due || ''}" aria-label="Fecha límite" style="width:170px">${[['Hoy', 0], ['Mañana', 1]].map(([l, n]) => `<button class="chip" data-act="s-due" data-v="${n}" aria-pressed="${w.due === ymd(addDays(new Date(), n))}">${l}</button>`).join('')}${w.due ? `<button class="chip" data-act="s-due-clear">Quitar</button>` : ''}</div></div>
          <div class="prop"><span>Prioridad</span><div class="chips">${[['', 'Normal'], ['baja', 'Baja'], ['media', 'Media'], ['alta', 'Alta']].map(([v, l]) => `<button class="chip c-${v || 'none'}" data-act="s-prio" data-v="${v}" aria-pressed="${(w.priority || '') === v}">${l}</button>`).join('')}</div></div>
          <div class="prop"><span>Área</span><select class="inp" id="s-area" aria-label="Área"><option value="">Sin área</option>${S.repos.map(r => `<option value="${r.id}" ${w.repo === r.id ? 'selected' : ''}>${esc(areaName(r))}</option>`).join('')}</select></div>
        </div>
        <label class="field">Notas<textarea class="inp" id="s-body" placeholder="Detalles, enlaces, lo que necesites recordar">${esc(w.body)}</textarea></label>
        <div>
          <div class="sub-h"><span>Subtareas</span>${w.checklist.length ? `<span>${ckDone}/${w.checklist.length}</span>` : ''}</div>
          ${w.checklist.length ? `<ul class="subs">${w.checklist.map((c, i) => `<li class="${c.done ? 'on' : ''}"><button class="check" data-act="sub-toggle" data-i="${i}" aria-label="${c.done ? 'Desmarcar' : 'Marcar'} ${esc(c.t)}">${ico('check')}</button><span>${esc(c.t)}</span><button class="tiny" data-act="sub-del" data-i="${i}" aria-label="Quitar subtarea">${ico('x')}</button></li>`).join('')}</ul>` : ''}
          <form class="sub-add" data-form="sub"><span class="faint" style="line-height:0">${ico('plus')}</span><input id="s-sub" placeholder="Agregar subtarea" autocomplete="off" aria-label="Agregar subtarea"></form>
        </div>
      </div>
      <div class="sheet-f">
        ${edit ? `<button class="btn danger ${D.armed ? 'armed' : ''}" data-act="s-delete">${D.armed ? 'Confirmar' : 'Eliminar'}</button><span class="spacer"></span><button class="btn primary" data-act="close-sheet">Listo</button>`
          : `<span class="spacer"></span><button class="btn" data-act="close-sheet">Cancelar</button><button class="btn primary" data-act="s-create">Agregar tarea</button>`}
      </div>
    </aside>`;
  });
}

/* ================= modals ================= */
function renderModal() {
  const root = $('#modal-root');
  if (S.areaEdit) return renderAreaEdit(root);
  if (!S.settings) { root.innerHTML = ''; if (!S.sheet) document.body.classList.remove('lock'); return; }
  document.body.classList.add('lock');
  const ex = [...S.tasks, ...S.events, ...S.reminders].filter(x => x.example).length;
  keepFocus(() => {
    root.innerHTML = `<div class="scrim" data-act="close-modal" style="z-index:41"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
      <div class="modal-h"><h2 id="m-h">Ajustes</h2><button class="iconbtn" data-act="close-modal" aria-label="Cerrar">${ico('x')}</button></div>
      <div class="modal-s"><label class="field">Tu nombre<input class="inp" id="set-name" value="${esc(S.config.name || '')}" placeholder="${esc(S.profileName || 'Cómo quieres que te salude')}" maxlength="40" autocomplete="off"></label></div>
      <div class="modal-s"><h3>Tus datos</h3>
        <span class="mode">${S.mode === 'db' ? 'Se guardan en tu cuenta y te siguen entre dispositivos.' : 'Se guardan en este navegador. Exporta un respaldo para no perderlos o pasarlos a otro dispositivo.'}</span>
        ${S.mode === 'local' && STANDALONE ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="export">Exportar respaldo</button><label class="btn sm" for="imp-file" style="cursor:pointer">Importar respaldo</label><input type="file" id="imp-file" accept="application/json,.json" hidden></div>` : ''}
        ${ex ? `<div><button class="btn sm danger ${S.settings.armed ? 'armed' : ''}" data-act="del-examples">${S.settings.armed ? `Confirmar: borrar ${ex} ejemplos` : `Borrar datos de ejemplo (${ex})`}</button></div>` : ''}
      </div>
      <div class="modal-s"><h3>Atajos de teclado</h3><div class="keys"><kbd>N</kbd><span>Nueva tarea</span><kbd>/</kbd><span>Buscar</span><kbd>1–5</kbd><span>Cambiar de sección</span><kbd>Esc</kbd><span>Cerrar</span></div></div>
    </div>`;
  });
}
function renderAreaEdit(root) {
  document.body.classList.add('lock');
  const E = S.areaEdit, w = E.work, isNew = !E.id;
  keepFocus(() => {
    root.innerHTML = `<div class="scrim" data-act="close-area-edit" style="z-index:41"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ae-h">
      <div class="modal-h"><h2 id="ae-h">${isNew ? 'Nueva área' : 'Editar área'}</h2><button class="iconbtn" data-act="close-area-edit" aria-label="Cerrar">${ico('x')}</button></div>
      <form data-form="area">
        <div class="modal-s">
          <label class="field">Nombre<input class="inp" id="ae-name" value="${esc(w.name)}" maxlength="40" autocomplete="off" placeholder="Servicio social"></label>
          ${E.err ? `<p class="err">${esc(E.err)}</p>` : ''}
          <label class="field">Descripción (opcional)<input class="inp" id="ae-desc" value="${esc(w.description)}" maxlength="140" placeholder="De qué trata"></label>
          <div class="field">Color<div class="colors">${COLORS.map(c => `<button type="button" data-act="ae-color" data-v="${c}" style="--ac:var(--a-${c})" aria-pressed="${w.color === c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
        </div>
        <div class="sheet-f">${isNew ? '' : `<button type="button" class="btn danger ${E.armed ? 'armed' : ''}" data-act="ae-delete">${E.armed ? 'Confirmar' : 'Eliminar'}</button>`}<span class="spacer"></span><button type="button" class="btn" data-act="close-area-edit">Cancelar</button><button class="btn primary" type="submit">${isNew ? 'Crear área' : 'Guardar'}</button></div>
      </form>
    </div>`;
