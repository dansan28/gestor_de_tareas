<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mainline: tus tareas, agenda, metas y enfoque del día en un solo lugar.">
<meta name="theme-color" content="#0c0a14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c6cf5'/%3E%3Cstop offset='1' stop-color='%235b5bf0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='10' fill='url(%23g)'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Mainline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark-only phone-shaped shell (full screen on phones, framed 430px column on desktop).
   Home = gradient hero with one big number + stat strip, then a rounded content panel; raised center add button in the bottom nav; bottom sheets and a full-screen focus mode. */
:root{
  color-scheme:dark;
  --page:#05040a; --bg:#0c0a14; --panel:#110e1b; --surface:#17131f; --surface2:#1f1a2b; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --fg:#f3f1fa; --muted:#a39db6; --faint:#6f6884;
  --accent:#8b7cf6; --accent2:#6366f1; --accent-soft:rgba(139,124,246,.16); --accent-fg:#c4b8ff;
  --pink:#f472b6; --sky:#38bdf8; --amber:#fbbf24; --lav:#a78bfa; --mint:#34d399; --peach:#fb923c; --teal:#2dd4bf;
  --rose:#fb7185; --rose-soft:rgba(251,113,133,.14); --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
  --a-blue:#60a5fa; --a-green:#34d399; --a-purple:#a78bfa; --a-orange:#fb923c; --a-red:#fb7185; --a-teal:#2dd4bf; --a-pink:#f472b6; --a-gray:#94a3b8;
  --hero:linear-gradient(165deg,#5b4ff0 0%,#5a3fd6 38%,#2b1d63 78%,#0c0a14 100%);
  --grad:linear-gradient(90deg,#a78bfa 0%,#f472b6 55%,#fbbf24 100%);
  --btn:linear-gradient(90deg,#7c6cf5,#5b5bf0);
  --shadow:0 10px 30px -10px rgba(0,0,0,.7); --glow:0 12px 30px -8px rgba(110,90,250,.65);
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html{height:100%;background:var(--page)}
body{height:100%;background:var(--page);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;display:flex;justify-content:center;align-items:center;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#5b4ff0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:2px;border-radius:12px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* ---------- shell ---------- */
.shell{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px){
  body{background:radial-gradient(1200px 600px at 50% 0%,#1c1340 0%,var(--page) 60%)}
  .shell{height:min(880px,calc(100% - 32px));border-radius:44px;box-shadow:0 40px 80px -20px rgba(0,0,0,.8),0 0 0 1px var(--line2)}
}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}

/* ---------- shared bits ---------- */
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.04);display:grid;place-items:center;color:var(--fg);position:relative;flex:none;transition:background .15s}
.round:hover{background:rgba(255,255,255,.09)}
.round .badge-n{position:absolute;top:6px;right:7px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--pink);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.pagehead{display:flex;align-items:center;gap:12px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:14px}
.pagehead h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em;flex:1}
.pagehead .hint{font-size:12px;color:var(--faint);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px}
.card.lav{background:linear-gradient(180deg,rgba(139,124,246,.13),rgba(139,124,246,.05));border-color:rgba(139,124,246,.18)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-h h3{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.card-h p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.icon-tile{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--fg);border:0;flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.link{border:0;background:none;padding:0;color:var(--accent-fg);font-size:12.5px;font-weight:600}
.link:hover{text-decoration:underline}
.seg{display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:12px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 4px 10px -4px rgba(0,0,0,.6)}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.opill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 16px;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line2)}
.opill[aria-pressed="true"]{color:var(--fg);border:1px solid transparent;background:linear-gradient(var(--surface2),var(--surface2)) padding-box,var(--grad) border-box}
.opill .ico{width:16px;height:16px}
.empty{text-align:center;color:var(--faint);padding:22px 10px;font-size:13px}
.skel{height:58px;border-radius:18px;background:var(--surface);margin-bottom:10px;opacity:.7}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac,var(--a-gray));flex:none}

/* ---------- home hero ---------- */
.hero{background:var(--hero);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:58px;text-align:center}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:linear-gradient(135deg,#f9a8d4,#a78bfa);display:grid;place-items:center;font-weight:800;color:#1b1233;font-size:16px;padding:0}
.datepill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:13px;border:0}
.datepill i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7}
.hero .round{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff}
.hello{margin:22px 0 4px;color:rgba(255,255,255,.78);font-size:14px;font-weight:500}
.big{margin:0;font-size:58px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff}
.big .frac{color:rgba(255,255,255,.42)}
.big-sub{margin:10px 0 0;color:rgba(255,255,255,.7);font-size:12.5px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:22px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px 4px}
.strip div{padding:0 6px;min-width:0}
.strip div + div{border-left:1px solid rgba(255,255,255,.14)}
.strip small{display:block;font-size:11px;color:rgba(255,255,255,.65)}
.strip b{display:block;font-size:22px;font-weight:800;color:#fff;margin:2px 0}
.strip span{display:block;font-size:11px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:relative;margin-top:-30px;background:var(--bg);border-radius:30px 30px 0 0;padding-top:20px}

/* ---------- chart ---------- */
.chart{display:block;width:100%;height:auto;margin-top:10px}
.range{font-size:12px;color:var(--accent-fg);font-weight:600;white-space:nowrap}

/* ---------- area cards (horizontal) ---------- */
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.acard{scroll-snap-align:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:16px;display:grid;gap:6px;min-width:0}
.acard:hover{border-color:var(--line2)}
.acard .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.acard b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.acard b small{font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar span{display:block;height:100%;border-radius:999px;background:var(--ac)}
.acard .foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.acard .foot em{font-style:normal;color:var(--ac);font-weight:700}

/* ---------- task rows ---------- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:4px 14px}
.group-t{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 4px 8px;display:flex;gap:8px}
.group-t.late{color:var(--rose)}
.group-t span{color:var(--faint);font-weight:500}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.group .trow:first-child{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);background:none;display:grid;place-items:center;color:#fff;padding:0;transition:all .15s}
.chk .ico{width:14px;height:14px;stroke-width:3;opacity:0;transform:scale(.6);transition:all .15s}
.chk:hover{border-color:var(--accent)}
.trow.alta .chk{border-color:rgba(251,113,133,.7)}
.trow.doing .chk{border-color:var(--accent);background:conic-gradient(var(--accent-soft) 0 50%,transparent 50% 100%)}
.trow.done .chk{background:var(--btn);border-color:transparent}
.trow.done .chk .ico{opacity:1;transform:none}
.tmain{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:grid;gap:3px}
.tt{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow.done .tt{color:var(--faint);text-decoration:line-through}
.tm{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--faint)}
.tm .late{color:var(--rose);font-weight:600}
.tm .soon{color:var(--amber);font-weight:600}
.tm .doing{color:var(--accent-fg);font-weight:600}
.tm .a{display:inline-flex;align-items:center;gap:6px}
.tm .a .dot{width:7px;height:7px}
.tside{display:flex;align-items:center;gap:6px;flex:none}
.prio{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.p-alta{background:var(--rose-soft);color:var(--rose)}
.p-media{background:var(--warn-soft);color:var(--amber)}
.p-baja{background:var(--ok-soft);color:var(--mint)}
.ghost{border:0;background:none;color:var(--faint);padding:6px;border-radius:10px;line-height:0}
.ghost:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.ghost.armed{background:var(--rose);color:#fff;line-height:18px;font-size:12px;font-weight:700;padding:4px 10px}

/* ---------- focus CTA ---------- */
.focus-cta{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:1px solid rgba(139,124,246,.22);background:radial-gradient(120% 140% at 0% 50%,rgba(244,114,182,.16),transparent 60%),var(--surface);border-radius:24px;padding:16px;margin-top:26px}
.mini-orb{position:relative;width:54px;height:54px;flex:none}
.mini-orb i{position:absolute;inset:0;border-radius:44% 56% 52% 48%/50% 45% 55% 50%;border:1.5px solid}
.mini-orb i:nth-child(1){border-color:rgba(167,139,250,.9);animation:spin 7s linear infinite}
.mini-orb i:nth-child(2){border-color:rgba(244,114,182,.75);animation:spin 9s linear infinite reverse;inset:3px}
.mini-orb i:nth-child(3){border-color:rgba(251,191,36,.7);animation:spin 11s linear infinite;inset:6px}
.focus-cta b{display:block;font-size:15px}
.focus-cta span{font-size:12.5px;color:var(--muted)}

/* ---------- search (tasks) ---------- */
.searchbox{display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;height:52px;border-radius:999px;border:1.5px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(90deg,rgba(167,139,250,.9),rgba(244,114,182,.6),rgba(251,191,36,.7)) border-box}
.searchbox .ico{color:var(--faint)}
.searchbox input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px}
.searchbox input::placeholder{color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);padding:9px 12px;font-size:13px;color:var(--fg);font-weight:500;max-width:100%}
.chip:hover{border-color:rgba(255,255,255,.22)}
.chip .ico{width:16px;height:16px}
.chip.on{background:var(--accent-soft);border-color:rgba(139,124,246,.5);color:var(--accent-fg)}
.chip .x{display:inline-grid;place-items:center;margin-right:-4px;color:var(--faint)}
.chip .x .ico{width:14px;height:14px}
.spark{color:var(--amber)}
.tile-i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac)}
.tile-i .ico{width:14px;height:14px}
.subh{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding-inline:20px;scrollbar-width:none;margin-top:16px}
.board::-webkit-scrollbar{display:none}
.col{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 14px;align-self:start;transition:box-shadow .15s}
.col.over{box-shadow:0 0 0 2px var(--accent)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:2px 0 6px}
.col .trow[draggable]{cursor:grab}
.col .trow.dragging{opacity:.4}

/* ---------- agenda ---------- */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.day{border:0;background:none;border-radius:18px;padding:10px 0 8px;display:grid;justify-items:center;gap:3px;color:var(--faint)}
.day:hover{background:rgba(255,255,255,.05)}
.day small{font-size:11px;font-weight:600;text-transform:uppercase}
.day b{font-size:16px;font-weight:700;color:var(--fg)}
.day.today b{color:var(--accent-fg)}
.day.sel{background:var(--btn);color:rgba(255,255,255,.8);box-shadow:var(--glow)}
.day.sel b{color:#fff}
.day i{width:5px;height:5px;border-radius:50%;background:var(--pink)}
.day.sel i{background:#fff}
.day i.none{visibility:hidden}
.cal-nav{display:flex;gap:8px}
.cal-nav .round{width:36px;height:36px}
.cal-nav .today-btn{width:auto;padding:0 12px;border-radius:999px;font-size:12px;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);padding:12px 14px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:rgba(255,255,255,.22)}
.btn .ico{width:16px;height:16px}
.btn.primary{width:100%;border:0;background:var(--btn);color:#fff;padding:16px;font-size:15px;font-weight:700;border-radius:999px;box-shadow:var(--glow)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border:0;background:none;color:var(--rose);padding:12px 6px}
.btn.danger.armed{background:var(--rose);color:#fff;padding:12px 16px}
.tl{display:grid;gap:10px}
.ev{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.ev::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--pc,var(--accent))}
.ev .when{font-size:13px;font-weight:700;color:var(--fg)}
.ev .when small{display:block;font-size:11px;font-weight:500;color:var(--faint)}
.ev .what{min-width:0;border:0;background:none;padding:0;text-align:left}
.ev .what b{display:block;font-weight:600;font-size:14px;overflow-wrap:anywhere}
.ev .what span{display:block;font-size:12px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
.ev.past{opacity:.5}
.ev.now{border-color:rgba(139,124,246,.5);background:linear-gradient(90deg,rgba(139,124,246,.14),transparent 70%),var(--surface)}
.ev.late .when{color:var(--rose)}
.ev.done .what b{text-decoration:line-through;color:var(--faint)}
.ev .ops{display:flex;gap:2px}
.gc{font-size:12px;color:var(--faint);margin:12px 4px 0}
.gc.warn{color:var(--amber)}

/* ---------- metrics ---------- */
.card-h .bignum{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0}
.delta{display:inline-block;white-space:nowrap;flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--mint)}
.delta.down{background:var(--rose-soft);color:var(--rose)}
.delta.flat{background:rgba(255,255,255,.06);color:var(--muted)}
.gbar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:18px}
.gbar span{display:block;height:100%;border-radius:999px;background:var(--grad);position:relative}
.gbar span::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 5px,transparent 5px 10px)}
.gmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.two small{display:block;font-size:12.5px;color:var(--muted)}
.two b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.sbar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.07);margin-top:14px}
.sbar span{height:100%;background:var(--sc);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,transparent 5px 10px)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-top:16px;font-size:13px}
.legend div{display:flex;align-items:center;gap:10px}
.legend .dot{width:10px;height:10px}
.legend span{flex:1;color:var(--muted)}
.legend b{font-weight:600}
.legend .zero .dot{background:rgba(255,255,255,.2)}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) 92px auto;gap:12px;align-items:center;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.brow:first-of-type{border-top:0}
.brow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function DbStore(db) {
  const chains = new Map(); // one write at a time per document
  const serial = (path, op) => {
    const next = (chains.get(path) || Promise.resolve()).catch(() => {}).then(() => withRetry(op));
    chains.set(path, next); return next;
  };
  const onErr = e => { if (e && e.code === 'revoked') toast('Se perdió el acceso a tus datos. Recarga la página.'); };
  return {
    kind:'db',
    subscribe(c, cb) { db.collection(c).onSnapshot(s => cb(s.docs.map(d => ({ ...d.data(), id:d.id }))), onErr); },
    subscribeConfig(cb) { db.doc('config/main').onSnapshot(s => cb(s.exists ? s.data() : null), onErr); },
    put(c, o) { return serial(`${c}/${o.id}`, () => db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)))); },
    del(c, id) { return serial(`${c}/${id}`, () => db.collection(c).doc(id).delete()); },
    putConfig(o) { return serial('config/main', () => db.doc('config/main').set(JSON.parse(JSON.stringify(o)))); },
  };
}
async function withRetry(op) {
  try { return await op(); }
  catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return op(); } throw e; }
}
function saveErr(e) {
  const c = e && e.code;
  toast(c === 'quota_exceeded' ? 'Se llenó el espacio. Borra tareas viejas para liberar espacio.'
    : c === 'invalid_argument' ? 'No se pudo guardar. Recarga la página e inténtalo de nuevo.'
    : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
}

const getArea = id => id ? S.repos.find(r => r.id === id) || null : null;
const areaName = r => r ? (r.name || cap((r.slug || '').replace(/[-_]+/g, ' '))) : '';
const areaColor = r => r && COLORS.includes(r.color) ? r.color : 'gray';
const areaKey = r => slugify(areaName(r));
const areaIcon = r => { const k = areaKey(r); return /servicio|trabajo|work|empleo/.test(k) ? 'briefcase' : /uni|escuela|clase|estudio|school/.test(k) ? 'book' : /proyect|dev|code|codigo/.test(k) ? 'code' : /personal|vida|casa/.test(k) ? 'user' : /salud|gym|health/.test(k) ? 'heart' : 'folder'; };

function upsertLocal(col, o) { const a = S[col], i = a.findIndex(x => x.id === o.id); if (i >= 0) a[i] = o; else a.push(o); }
function put(col, o) { upsertLocal(col, o); render(); return store.put(col, o).catch(saveErr); }
function del(col, id) { S[col] = S[col].filter(x => x.id !== id); render(); return store.del(col, id).catch(saveErr); }
function saveTask(t) { t.updatedAt = Date.now(); return put('tasks', t); }
function saveConfig(patch) { S.config = { ...S.config, ...patch }; render(); return store.putConfig({ ...S.config }).catch(saveErr); }
function celebrate() {
  if (reduceMotion() || typeof window.confetti !== 'function') return;
  try { window.confetti({ particleCount:46, spread:64, origin:{ y:.82 }, colors:['#a78bfa','#f472b6','#fbbf24','#60a5fa','#34d399'] }); } catch {}
}
function setStatus(id, status, undo = true) {
  const t = getTask(id); if (!t || t.status === status) return;
  const prev = t.status, n = structuredClone(t);
  n.status = status; n.closedAt = status === 'done' ? Date.now() : null;
  saveTask(n);
  if (status === 'done') celebrate();
  if (undo) toast(status === 'done' ? 'Tarea completada' : prev === 'done' ? 'Tarea reabierta' : `Movida a ${STATUS[status]}`, { label:'Deshacer', fn:() => setStatus(id, prev, false) });
}
function createTask(f) {
  const num = S.tasks.reduce((m, t) => Math.max(m, t.num || 0), 0) + 1;
  const t = { id:'t_' + rid(), num, title:f.title.trim(), body:f.body || '', labels:[], priority:f.priority || null,
    due:f.due || null, time:f.time || null, status:f.status || 'todo', checklist:f.checklist || [], repo:f.repo || null,
    createdAt:Date.now(), closedAt:f.status === 'done' ? Date.now() : null };
  saveTask(t); return t;
}

/* ================= sorting & stats ================= */
const byPrioDue = (a, b) => (PRIO_RANK[a.priority] ?? 3) - (PRIO_RANK[b.priority] ?? 3) || (a.due || '9999').localeCompare(b.due || '9999') || (a.time || '99').localeCompare(b.time || '99');
const byDuePrio = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.time || '99').localeCompare(b.time || '99') || (PRIO_RANK[a.priority] ?? 3) - (PRIO_RANK[b.priority] ?? 3);
const byClosed = (a, b) => (b.closedAt || 0) - (a.closedAt || 0);
function closedPerDay() { const m = {}; S.tasks.forEach(t => { const k = closedDay(t); if (k) m[k] = (m[k] || 0) + 1; }); return m; }
function streak(per) { let n = 0, cur = new Date(); if (!per[ymd(cur)]) cur = addDays(cur, -1); while (per[ymd(cur)]) { n++; cur = addDays(cur, -1); } return n; }

/* ================= chart ================= */
// Smooth area chart drawn to one scale; vals/prev are arrays of numbers, labels are {i, t}
let chartSeq = 0;
function areaChart(vals, prev, labels, opts = {}) {
  const W = 320, H = opts.h || 130, pl = 6, pr = 10, pt = 14, pb = 24, n = vals.length;
  const max = Math.max(1, ...vals, ...(prev || []));
  const X = i => n === 1 ? W / 2 : pl + i * (W - pl - pr) / (n - 1);
  const Y = v => pt + (1 - v / max) * (H - pt - pb);
  const base = H - pb;
  const smooth = arr => {
    const pts = arr.map((v, i) => [X(i), Y(v)]);
    if (pts.length < 2) return `M${pts[0][0]},${pts[0][1]}`;
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = Math.min(base, Math.max(pt, p1[1] + (p2[1] - p0[1]) / 6));
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = Math.min(base, Math.max(pt, p2[1] - (p3[1] - p1[1]) / 6));
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  };
  const id = 'g' + (++chartSeq);
  const line = smooth(vals);
  const last = vals.length - 1;
  const grid = [0, .5, 1].map(f => `<line x1="${pl}" x2="${W - pr}" y1="${(pt + f * (H - pt - pb)).toFixed(1)}" y2="${(pt + f * (H - pt - pb)).toFixed(1)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || '')}">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b7cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}l" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".6" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
    ${grid}
    ${prev && prev.length > 1 ? `<path d="${smooth(prev)}" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5" stroke-dasharray="4 4"/>` : ''}
    <path d="${line} L${X(last).toFixed(1)},${base} L${X(0).toFixed(1)},${base} Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="url(#${id}l)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="${X(last).toFixed(1)}" cy="${Y(vals[last]).toFixed(1)}" r="4.5" fill="#0c0a14" stroke="#f472b6" stroke-width="2.5"/>
    ${labels.map(l => `<text x="${X(l.i).toFixed(1)}" y="${H - 6}" fill="#6f6884" font-size="10" font-family="Plus Jakarta Sans, system-ui, sans-serif" text-anchor="${l.i === 0 ? 'start' : l.i === n - 1 ? 'end' : 'middle'}">${esc(l.t)}</text>`).join('')}
  </svg>`;
}

/* ================= events & Google Calendar ================= */
function allEvents() {
  return [...S.events.map(e => ({ ...e, source:'local' })), ...S.gcal.events]
    .sort((a, b) => a.date.localeCompare(b.date) || (a.start || '').localeCompare(b.start || ''));
}
function normGcal(ev) {
  const s = ev.start || {}, e = ev.end || {};
  let date, start = null, end = null, allDay = false;
  if (s.dateTime) { const d = new Date(s.dateTime); date = ymd(d); start = hhmm(d); if (e.dateTime) end = hhmm(new Date(e.dateTime)); }
  else if (s.date) { date = String(s.date).slice(0, 10); allDay = true; }
  else return null;
  return { id:'g_' + ev.id, title:ev.summary || '(Sin título)', date, start, end, allDay, location:ev.location || '', link:ev.htmlLink || '', source:'gcal' };
}
const GC = 'Google Calendar';
let gcalUnwatch = null, mcpNs = null;
const gcalInput = () => { const d = mondayOf(new Date()); return { startTime:ymd(d) + 'T00:00:00', endTime:ymd(addDays(d, 28)) + 'T00:00:00', orderBy:'startTime', pageSize:150 }; };
function applyGcal(result) {
  const p = result && result.payload, list = p && Array.isArray(p.events) ? p.events : [];
  S.gcal.events = list.filter(e => e.status !== 'cancelled').map(normGcal).filter(Boolean);
  S.gcal.status = 'ok'; S.gcal.stale = false; S.gcal.storedAt = result.cache ? result.cache.storedAt : Date.now();
  render();
}
const GC_DENIALS = ['needs_reauth','server_not_connected','selection_required','blocked_by_policy','not_in_manifest','approval_required','server_not_found','not_granted','capability_disabled','capability_removed'];
function gcalError(err) {
  const code = err && err.code;
  if (GC_DENIALS.includes(code)) { S.gcal.events = []; S.gcal.status = code; }
  else { S.gcal.stale = true; if (S.gcal.status !== 'ok') S.gcal.status = 'error'; }
  render();
}
function startGcalWatch() {
  if (!mcpNs) return;
  if (gcalUnwatch) gcalUnwatch();
  if (S.gcal.status !== 'ok') S.gcal.status = 'loading';
  gcalUnwatch = mcpNs.watchTool(GC, 'list_events', gcalInput(), ev => ev.type === 'data' ? applyGcal(ev.result) : gcalError(ev.error), { refetchInterval:5 * 60 * 1000 });
}
async function gcalAllow() {
  if (!mcpNs) return;
  S.gcal.status = 'loading'; render();
  try { applyGcal(await mcpNs.callTool(GC, 'list_events', gcalInput())); startGcalWatch(); } catch (e) { gcalError(e); }
}
function gcalLine() {
  const g = S.gcal, connect = 'Conecta Google Calendar en claude.ai (Ajustes → Conectores) para ver tus eventos aquí.';
  const m = {
    loading:'Cargando Google Calendar…',
    ok:g.stale ? 'Google Calendar no se pudo actualizar; mostrando lo último.' : `Incluye Google Calendar · actualizado ${ago(g.storedAt)}`,
    approval_required:'Tus eventos de Google Calendar pueden aparecer aquí. <button class="link" data-act="gcal-allow">Mostrarlos</button>',

    not_in_manifest:'Google Calendar está desactivado para esta página. Actívalo desde el menú de permisos.',

}

/* ================= toasts ================= */
function toast(msg, action, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = '<span></span>';
  el.querySelector('span').textContent = msg;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  const box = $('#toasts'); box.appendChild(el);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => el.remove(), kind === 'bell' ? 20000 : 4000);
}

/* ================= render core ================= */
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.id;
  let s = null, e = null;
  try { s = a.selectionStart; e = a.selectionEnd; } catch {}
  fn();
  if (id) { const n = document.getElementById(id); if (n && n !== document.activeElement) { n.focus({ preventScroll:true }); try { if (s != null) n.setSelectionRange(s, e); } catch {} } }
}
function greeting(d) { const h = d.getHours(); return h < 5 ? 'Sigues despierto' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches'; }
function render() {
  keepFocus(() => {
    const items = VIEWS.map(v => `<button class="tab" data-act="nav" data-v="${v.id}" ${S.view === v.id ? 'aria-current="page"' : ''}>${ico(v.icon)}<span>${v.label}</span></button>`);
    items.splice(2, 0, `<button class="fab" data-act="new" aria-label="Nueva tarea">${ico('plus')}</button>`);

}

/* ---------- task row ---------- */
function taskRow(t, o = {}) {
  const td = today(), a = o.hideArea ? null : getArea(t.repo), meta = [];
  if (t.status === 'doing' && !o.board) meta.push('<span class="doing">En curso</span>');
  if (a) meta.push(`<span class="a"><i class="dot" style="--ac:var(--a-${areaColor(a)})"></i>${esc(areaName(a))}</span>`);
  if (t.due && t.status !== 'done' && !o.hideDue) meta.push(`<span class="${t.due < td ? 'late' : t.due === td ? 'soon' : ''}">${esc(dueText(t.due))}${t.time ? ' · ' + esc(t.time) : ''}</span>`);
  else if (t.time && t.status !== 'done') meta.push(`<span>${esc(t.time)}</span>`);
  if (t.status === 'done' && t.closedAt) meta.push(`<span>Hecha ${esc(ago(t.closedAt))}</span>`);
  const ck = t.checklist || [];
  if (ck.length) meta.push(`<span>${ck.filter(c => c.done).length}/${ck.length} subtareas</span>`);
  const armed = S.armed === 'task:' + t.id;
  const cls = ['trow', t.status === 'done' ? 'done' : '', t.status === 'doing' ? 'doing' : '', t.priority === 'alta' && t.status !== 'done' ? 'alta' : ''].join(' ');
  return `<div class="${cls}" ${o.board ? `draggable="true" data-id="${t.id}"` : ''}>
    <button class="chk" data-act="toggle" data-id="${t.id}" aria-label="${t.status === 'done' ? 'Marcar como pendiente' : 'Completar'}: ${esc(t.title)}">${ico('check')}</button>
    <button class="tmain" data-act="open" data-id="${t.id}"><span class="tt">${esc(t.title)}</span>${meta.length ? `<span class="tm">${meta.join('')}</span>` : ''}</button>
    <span class="tside">
      ${t.priority && t.status !== 'done' ? `<span class="prio p-${t.priority}">${PRIO_TXT[t.priority]}</span>` : ''}
      ${o.board ? `<button class="ghost" data-act="move" data-id="${t.id}" data-to="${o.next || o.prev || ''}" aria-label="Mover a ${STATUS[o.next || o.prev]}">${ico(o.next ? 'right' : 'left')}</button>`
        : o.noDelete ? '' : `<button class="ghost ${armed ? 'armed' : ''}" data-act="del-task" data-id="${t.id}" aria-label="Eliminar tarea">${armed ? '¿Borrar?' : ico('trash')}</button>`}
    </span>
  </div>`;
}

/* ---------- Inicio ---------- */
function viewInicio() {
  const now = new Date(), td = ymd(now), nm = userName().split(' ')[0];
  const todaySet = S.tasks.filter(t => t.due === td || closedDay(t) === td || (t.status === 'doing'));
  const doneToday = todaySet.filter(t => t.status === 'done').length;
  const pct = todaySet.length ? Math.round(doneToday / todaySet.length * 100) : 0;
  const open = S.tasks.filter(isOpen), late = open.filter(t => t.due && t.due < td);
  const per = closedPerDay(), mon = mondayOf(now);
  let weekDone = 0; for (let i = 0; i < 7; i++) weekDone += per[ymd(addDays(mon, i))] || 0;
  const st = streak(per);
  const remToday = S.reminders.filter(r => !r.done && r.at.slice(0, 10) <= td).length;
  // trend: last 14 days
  const days = Array.from({ length:14 }, (_, i) => addDays(now, i - 13));
  const vals = days.map(d => per[ymd(d)] || 0), maxV = Math.max(...vals);
  const labels = [0, 4, 9].map(i => ({ i, t:clean(fDay.format(days[i])) })).concat([{ i:13, t:'Hoy' }]);
  const prio = open.filter(t => (t.due && t.due <= td) || t.status === 'doing' || t.priority === 'alta')
    .sort((a, b) => ((b.due && b.due < td) - (a.due && a.due < td)) || byPrioDue(a, b)).slice(0, 5);
  const agenda = dayItems(td).filter(x => x.kind !== 'task').slice(0, 3);

  return `
  <section class="hero gut">
    <div class="hero-top">
      <button class="avatar" data-act="settings" aria-label="Ajustes">${esc((nm || '·').charAt(0).toUpperCase())}</button>
      <span class="datepill">${esc(cap(clean(fShortDate.format(now))))}<i></i></span>
      <button class="round" data-act="bell" aria-label="Recordatorios${remToday ? ': ' + remToday + ' pendientes' : ''}">${ico('bell')}${remToday ? `<span class="badge-n">${remToday}</span>` : ''}</button>
    </div>
    <p class="hello">${greeting(now)}${nm ? `, ${esc(nm)}` : ''}</p>
    <p class="big">${loading() ? '—' : `${doneToday}<span class="frac">/${todaySet.length}</span>`}</p>
    <p class="big-sub">${loading() ? 'Cargando tu día…' : todaySet.length ? `tareas de hoy completadas · ${pct}%` : 'Sin tareas para hoy'}</p>
    <div class="strip">
      <div><small>Pendientes</small><b>${open.length}</b><span>${late.length ? plural(late.length, 'vencida', 'vencidas') : 'al día'}</span></div>
      <div><small>Esta semana</small><b>${weekDone}</b><span>de ${weeklyGoal()} de meta</span></div>
      <div><small>Racha</small><b>${st}</b><span>${st === 1 ? 'día' : 'días'} seguidos</span></div>
    </div>
  </section>
  <section class="panel gut">
    <div class="card">
      <div class="card-h"><h3>Tendencia · 2 semanas</h3><span class="range">0 — ${maxV} por día</span></div>
      ${areaChart(vals, null, labels, { label:`Tareas cerradas por día en las últimas dos semanas, máximo ${maxV}` })}
    </div>

    <div class="sec-h"><h2>Áreas</h2><button class="link" data-act="new-area">Nueva</button></div>
    ${!S.reposLoaded ? skeleton(1) : S.repos.length ? `<div class="hscroll">${sortedAreas().map(r => {
      const ts = S.tasks.filter(t => t.repo === r.id), dn = ts.filter(t => !isOpen(t)).length, op = ts.length - dn, p = ts.length ? Math.round(dn / ts.length * 100) : 0;
      return `<button class="acard" data-act="area-go" data-v="${r.id}" style="--ac:var(--a-${areaColor(r)})"><span class="nm"><span class="tile-i">${ico(areaIcon(r))}</span>${esc(areaName(r))}</span><b>${op}<small>${op === 1 ? 'pendiente' : 'pendientes'}</small></b><span class="bar"><span style="width:${p}%"></span></span><span class="foot"><em>${p}%</em><span>de ${ts.length}</span></span></button>`;
    }).join('')}</div>` : `<div class="empty">Crea un área para agrupar tus tareas.</div>`}

    <div class="sec-h"><h2>Prioridades de hoy</h2><button class="link" data-act="nav" data-v="tareas">Ver todo</button></div>
    ${loading() ? skeleton() : prio.length ? groupBox(prio.map(t => taskRow(t))) : `<div class="empty">Nada urgente. Buen momento para adelantar.</div>`}

    ${agenda.length ? `<div class="sec-h"><h2>Agenda de hoy</h2><button class="link" data-act="nav" data-v="agenda">Ver agenda</button></div><div class="tl">${agenda.map(evItem).join('')}</div>` : ''}

      <span class="mini-orb" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><b>Sesión de enfoque</b><span>${prio[0] ? `25 min en “${esc(prio[0].title)}”` : '25 minutos sin distracciones'}</span></span>
    </button>
  </section>`;
}

/* ---------- Tareas ---------- */
function smartMatch(t, id) {
  const td = today(), we = ymd(addDays(mondayOf(new Date()), 6));
  if (id === 'late') return isOpen(t) && t.due && t.due < td;
  if (id === 'alta') return t.priority === 'alta';
  if (id === 'week') return t.due && t.due >= td && t.due <= we;
  if (id === 'doing') return t.status === 'doing';
  if (id === 'nodate') return !t.due;
  return true;
}
function bucketize(tasks) {
  const td = today(), tm = ymd(addDays(new Date(), 1)), we = ymd(addDays(mondayOf(new Date()), 6));
  const B = [['late','Vencidas'],['today','Hoy'],['tomorrow','Mañana'],['week','Esta semana'],['later','Más adelante'],['none','Sin fecha']].map(([k, l]) => ({ k, l, items:[] }));
  const get = k => B.find(b => b.k === k).items;
  tasks.forEach(t => {
    if (!t.due) get('none').push(t);
    else if (t.due < td) get('late').push(t);
    else if (t.due === td) get('today').push(t);
    else if (t.due === tm) get('tomorrow').push(t);
    else if (t.due <= we) get('week').push(t);
    else get('later').push(t);
  });

/* ---------- Agenda ---------- */
function dayItems(day) {
  const now = new Date(), nowT = hhmm(now), td = today(), items = [];
  allEvents().filter(e => e.date === day).forEach(e => {
    const past = day < td || (day === td && e.end && e.end <= nowT);
    const live = day === td && e.start && e.end && e.start <= nowT && e.end > nowT;
    items.push({ kind:'event', sort:e.allDay || !e.start ? '00:00' : e.start, e, past, live });
  });
  S.reminders.filter(r => r.at.slice(0, 10) === day).forEach(r => items.push({ kind:'rem', sort:r.at.slice(11, 16), r, past:r.done, late:!r.done && new Date(r.at) < now }));
  S.tasks.filter(t => t.due === day).forEach(t => items.push({ kind:'task', sort:t.time || '23:59', t, past:t.status === 'done', late:isOpen(t) && day < td }));
  return items.sort((a, b) => a.sort.localeCompare(b.sort));
}

/* ---------- Métricas ---------- */
function periodSeries(period) {
  const now = new Date(), per = closedPerDay();
  const sumRange = (a, b) => { let n = 0; for (let d = new Date(a); d <= b; d = addDays(d, 1)) n += per[ymd(d)] || 0; return n; };
  if (period === 'week') {
    const mon = mondayOf(now), pmon = addDays(mon, -7), n = (now.getDay() + 6) % 7 + 1;
    const vals = Array.from({ length:7 }, (_, i) => per[ymd(addDays(mon, i))] || 0).slice(0, n);
    const prev = Array.from({ length:7 }, (_, i) => per[ymd(addDays(pmon, i))] || 0);
    const labels = DAY_NAMES.map((t, i) => ({ i, t })).slice(0, n);
    if (n === 1) labels[0].t = 'Hoy'; else labels[n - 1] = { i:n - 1, t:'Hoy' };
    return { vals:vals.length > 1 ? vals : [0, ...vals], prev:prev.slice(0, Math.max(2, n)), labels:vals.length > 1 ? labels : [{ i:1, t:'Hoy' }], total:vals.reduce((a, b) => a + b, 0), prevTotal:sumRange(pmon, addDays(pmon, n - 1)), unit:'esta semana', vsTxt:'vs semana pasada' };
  }
  if (period === 'month') {
    const y = now.getFullYear(), m = now.getMonth(), n = now.getDate();
    const vals = Array.from({ length:n }, (_, i) => per[ymd(new Date(y, m, i + 1))] || 0);
    const prevDays = new Date(y, m, 0).getDate();
    const prev = Array.from({ length:Math.min(n, prevDays) }, (_, i) => per[ymd(new Date(y, m - 1, i + 1))] || 0);
    const labels = [1, 8, 15, 22].filter(d => d < n - 2).map(d => ({ i:d - 1, t:`${d} ${clean(fDay.format(now).split(' ')[1] || '')}` })).concat([{ i:n - 1, t:'Hoy' }]);
    return { vals:n > 1 ? vals : [0, ...vals], prev, labels, total:vals.reduce((a, b) => a + b, 0), prevTotal:prev.reduce((a, b) => a + b, 0), unit:'este mes', vsTxt:'vs mes pasado' };
  }
  const y = now.getFullYear(), m = now.getMonth();
  const monthSum = (yy, mm) => sumRange(new Date(yy, mm, 1), new Date(yy, mm + 1, 0));
  const vals = Array.from({ length:m + 1 }, (_, i) => monthSum(y, i));
  const prev = Array.from({ length:m + 1 }, (_, i) => monthSum(y - 1, i));
  const letters = ['E','F','M','A','M','J','J','A','S','O','N','D'];
  return { vals:m ? vals : [0, ...vals], prev, labels:letters.slice(0, m + 1).map((t, i) => ({ i, t })), total:vals.reduce((a, b) => a + b, 0), prevTotal:prev.reduce((a, b) => a + b, 0), unit:'este año', vsTxt:'vs año pasado' };
}
function viewMetricas() {
  const now = new Date(), per = closedPerDay(), mon = mondayOf(now), we = ymd(addDays(mon, 6)), ws = ymd(mon);
  const s = periodSeries(S.period);
  const diff = s.total - s.prevTotal;
  const deltaCls = diff > 0 ? '' : diff < 0 ? 'down' : 'flat';
  const deltaTxt = `${diff > 0 ? '+' : ''}${diff} ${s.vsTxt}`;
  // weekly goal
  const week = Array.from({ length:7 }, (_, i) => per[ymd(addDays(mon, i))] || 0);
  const weekDone = week.reduce((a, b) => a + b, 0), goal = weeklyGoal(), gp = Math.min(100, Math.round(weekDone / goal * 100));
  // daily activity: completed this week vs total planned this week
  const planned = S.tasks.filter(t => (t.due && t.due >= ws && t.due <= we) || (closedDay(t) && closedDay(t) >= ws && closedDay(t) <= we)).length;
  const total = Math.max(planned, weekDone);
  // by area
  const areas = sortedAreas().map(r => { const ts = S.tasks.filter(t => t.repo === r.id); const dn = ts.filter(t => !isOpen(t)).length; return { r, dn, n:ts.length }; });
    const td = today(), late = S.tasks.filter(t => isOpen(t) && t.due && t.due < td).sort(byDuePrio);
  const best = week.reduce((b, n, i) => n > b.n ? { n, i } : b, { n:0, i:-1 });
  const tip = late.length ? `Tienes ${plural(late.length, 'tarea vencida', 'tareas vencidas')}. Empieza por “${late[0].title}”.`
    : best.n > 1 ? `Tu mejor día esta semana fue el ${fWd.format(addDays(mon, best.i))}, con ${best.n} tareas.`
    : weekDone >= goal ? '¡Cumpliste tu meta semanal! Considera subirla un poco.' : `Te faltan ${goal - weekDone} tareas para tu meta de la semana.`;

  return `<div class="gut">
    <div class="pagehead"><h1>Métricas</h1><span class="hint">Tu ritmo<br>y tus metas</span></div>
    <div class="pills" role="group" aria-label="Periodo">${[['week', 'Semana', 'chart'], ['month', 'Mes', 'cal'], ['year', 'Año', 'spark']].map(([k, l, i]) => `<button class="opill" data-act="period" data-v="${k}" aria-pressed="${S.period === k}">${ico(i)}${l}</button>`).join('')}</div>

    <div class="card" style="margin-top:16px">
      <div class="card-h"><div><p class="bignum">${s.total}</p><p>${s.total === 1 ? 'tarea cerrada' : 'tareas cerradas'} ${s.unit}</p></div><span class="delta ${deltaCls}">${esc(deltaTxt)}</span></div>
      ${areaChart(s.vals, s.prev, s.labels, { label:`Tareas cerradas ${s.unit}: ${s.total}. Línea punteada: periodo anterior, ${s.prevTotal}.` })}
    </div>

    <div class="card lav" style="margin-top:14px">
      <div class="card-h"><div><h3>Meta semanal</h3><p>Mantén el ritmo y mide tu avance cada día.</p></div><button class="icon-tile" data-act="goal" aria-label="Cambiar meta semanal">${ico('edit')}</button></div>
      <div class="gbar" role="img" aria-label="${weekDone} de ${goal} tareas, ${gp}%"><span style="width:${gp}%"></span></div>
      <div class="gmeta"><span>Tareas ${weekDone}/${goal}</span><span>${gp}% completado</span></div>
    </div>

    <div class="card lav" style="margin-top:14px">
      <div class="card-h"><div><h3>Actividad diaria</h3><p>${esc(cap(clean(fDay.format(mon))))} – ${esc(clean(fDay.format(addDays(mon, 6))))}</p></div><button class="icon-tile" data-act="nav" data-v="agenda" aria-label="Ver agenda">${ico('cal')}</button></div>
      <div class="two"><div><small>Completadas</small><b>${weekDone}</b></div><div><small>Planeadas</small><b>${total}</b></div></div>
      <div class="sbar" role="img" aria-label="Tareas completadas por día: ${week.map((n, i) => `${DAY_NAMES[i]} ${n}`).join(', ')}">${week.map((n, i) => n ? `<span style="--sc:${DAY_COLORS[i]};width:${n / Math.max(1, total) * 100}%"></span>` : '').join('')}</div>
      <div class="legend">${week.map((n, i) => `<div class="${n ? '' : 'zero'}"><i class="dot" style="--ac:${DAY_COLORS[i]}"></i><span>${DAY_NAMES[i]}</span><b>${pad(n)}</b></div>`).join('')}</div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="card-h" style="margin-bottom:6px"><h3>Por área</h3><button class="link" data-act="new-area">Nueva área</button></div>
      ${areas.length ? areas.map(({ r, dn, n }) => `<button class="brow" data-act="edit-area" data-id="${r.id}" style="--ac:var(--a-${areaColor(r)})"><span class="tile-i" style="width:30px;height:30px;border-radius:10px">${ico(areaIcon(r))}</span><span class="nm">${esc(areaName(r))}</span><span class="bar"><span style="width:${n ? dn / n * 100 : 0}%"></span></span><span class="v">${dn}/${n}</span></button>`).join('') : '<p class="note">Aún no tienes áreas.</p>'}
    </div>

    <div class="card" style="margin-top:14px;display:flex;gap:12px;align-items:flex-start"><span class="spark" style="margin-top:2px">${ico('spark')}</span><p class="note"><b style="display:block;color:var(--fg);margin-bottom:2px">Consejo</b>${esc(tip)}</p></div>
  </div>`;
}

/* ================= focus mode ================= */
let focusTimer = null;
const fmt = s => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
function openFocus(taskId) {
  S.focus = { taskId:taskId || null, total:25 * 60, remaining:25 * 60, running:false, endAt:0 };
  renderFocus();
}
function focusRemaining() { const f = S.focus; return f.running ? Math.max(0, (f.endAt - Date.now()) / 1000) : f.remaining; }
function renderFocus() {
  const root = $('#focus-root'), f = S.focus;
  if (!f) { root.innerHTML = ''; clearInterval(focusTimer); focusTimer = null; return; }
  const t = getTask(f.taskId), rem = focusRemaining(), done = rem <= 0;
  root.innerHTML = `<section class="focus gut" role="dialog" aria-modal="true" aria-label="Sesión de enfoque">
    <div class="focus-bar"><button class="round" data-act="focus-close" aria-label="Salir">${ico('left')}</button><h3>Enfoque</h3><span style="width:44px"></span></div>
    <div class="orb-wrap"><div class="orb ${f.running ? '' : 'paused'}"><span class="glow"></span><i></i><i></i><i></i><i></i><i></i><i></i>
      <div class="orb-c">${ico('target')}<span class="timer" id="focus-time" aria-live="off">${fmt(rem)}</span><small>${t ? esc(t.title) : 'Sin distracciones'}</small></div></div></div>
    ${!f.running && f.remaining === f.total ? `<div class="durs" role="group" aria-label="Duración">${[15, 25, 50].map(m => `<button class="opill" data-act="focus-dur" data-v="${m}" aria-pressed="${f.total === m * 60}">${m} min</button>`).join('')}</div>` : ''}
    ${done ? `<div class="durs">${t && isOpen(t) ? `<button class="opill" aria-pressed="true" data-act="focus-complete">Marcar tarea como hecha</button>` : ''}<button class="opill" data-act="focus-reset">Otra sesión</button></div>` : ''}
    <div class="ctrls">
      <button class="side" data-act="focus-close" aria-label="Terminar sesión">${ico('stop')}</button>
      <button class="play" data-act="focus-toggle" aria-label="${f.running ? 'Pausar' : 'Iniciar'}">${ico(f.running ? 'pause' : 'play')}</button>
      <button class="side" data-act="focus-reset" aria-label="Reiniciar">${ico('reset')}</button>
    </div>
  </section>`;
  clearInterval(focusTimer); focusTimer = null;
  if (f.running) focusTimer = setInterval(() => {
    const r = focusRemaining(), el = $('#focus-time');
    if (el) el.textContent = fmt(r);
    if (r <= 0) { f.running = false; f.remaining = 0; renderFocus(); toast('¡Sesión completada! Toma un descanso.', null, 'bell'); celebrate(); }
  }, 250);
}

/* ================= backup (standalone) ================= */
function exportData() {
  let raw = null; try { raw = localStorage.getItem('mainline:v1'); } catch {}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([raw || '{}'], { type:'application/json' }));
  a.download = `mainline-respaldo-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!d || typeof d !== 'object' || typeof d.tasks !== 'object') throw new Error('invalid');
    ['tasks','events','reminders','repos'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
    localStorage.setItem('mainline:v1', JSON.stringify(d));
    location.reload();
  } catch { toast('Ese archivo no es un respaldo válido de Mainline.'); }
}

/* ================= navigation & helpers ================= */
function go(view) {
  S.view = view; S.armed = null;
  try { history.replaceState(null, '', '#' + view); } catch {}
  render(); $('#view').scrollTop = 0;
}
const newTaskWork = () => ({ title:'', body:'', priority:null, due:S.view === 'agenda' && S.selDay ? S.selDay : today(), time:'', status:'todo', checklist:[], repo:S.view === 'tareas' && S.areaFilter && S.areaFilter !== 'none' ? S.areaFilter : null });
function readTaskForm() {
  const w = S.sheet.work;
  w.title = $('#f-title').value; w.due = $('#f-due').value || null; w.time = $('#f-time').value || null; w.body = $('#f-body').value;
}
function armOnce(key) {
  if (S.armed === key) { S.armed = null; return true; }
  S.armed = key; render();
  setTimeout(() => { if (S.armed === key) { S.armed = null; render(); } }, 3000);
  return false;
}
function rememberSearch(q) {
  q = q.trim(); if (q.length < 2) return;
  S.recent = [q, ...S.recent.filter(r => r.toLowerCase() !== q.toLowerCase())].slice(0, 6);
  lsSet('mainline:recent', S.recent);
}

/* ================= clicks ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  if (S.armed && !act.startsWith('del-')) { S.armed = null; render(); }
  switch (act) {
    case 'nav': go(t.dataset.v); break;
    case 'new': openSheet('task', { work:newTaskWork() }); break;
    case 'open': { const k = getTask(id); if (k) openSheet('task', { id, work:{ checklist:[], ...structuredClone(k) } }); break; }
    case 'toggle': { const k = getTask(id); if (k) setStatus(id, k.status === 'done' ? 'todo' : 'done'); break; }
    case 'move': if (t.dataset.to) setStatus(id, t.dataset.to); break;
    case 'del-task': if (armOnce('task:' + id)) { del('tasks', id); toast('Tarea eliminada'); } break;
    case 'del-event': if (armOnce('event:' + id)) del('events', id); break;
    case 'del-rem': if (armOnce('rem:' + id)) del('reminders', id); break;
    case 'rem-toggle': { const r = S.reminders.find(x => x.id === id); if (r) put('reminders', { ...structuredClone(r), done:!r.done }); break; }
    case 'bell': S.selDay = today(); S.weekOffset = 0; go('agenda'); break;
    case 'status': S.status = t.dataset.v; render(); break;
    case 'layout': S.layout = S.layout === 'board' ? 'list' : 'board'; render(); break;
    case 'smart': S.smart = S.smart === t.dataset.v ? '' : t.dataset.v; if (S.smart === 'late' || S.smart === 'doing') S.status = 'pending'; render(); break;
    case 'area-filter': S.areaFilter = S.areaFilter === t.dataset.v ? '' : t.dataset.v; render(); break;
    case 'area-go': S.areaFilter = t.dataset.v; S.smart = ''; S.search = ''; S.status = 'pending'; S.layout = 'list'; go('tareas'); break;
    case 'recent': S.search = t.dataset.v; render(); break;
    case 'recent-del': S.recent.splice(+t.dataset.i, 1); lsSet('mainline:recent', S.recent); render(); break;
    case 'clear-search': S.search = ''; render(); setTimeout(() => $('#search')?.focus(), 0); break;
    case 'week': { const v = +t.dataset.v; if (v === 0) { S.weekOffset = 0; S.selDay = today(); } else { const dow = (parseYmd(S.selDay || today()).getDay() + 6) % 7; S.weekOffset += v; S.selDay = ymd(addDays(mondayOf(new Date()), S.weekOffset * 7 + dow)); } render(); break; }
    case 'day': S.selDay = t.dataset.v; render(); break;
    case 'period': S.period = t.dataset.v; render(); break;
    case 'new-event': openSheet('event'); break;
    case 'new-rem': openSheet('rem'); break;
    case 'gcal-allow': gcalAllow(); break;
    case 'new-area': openSheet('area', { work:{ name:'', description:'', color:COLORS[S.repos.length % COLORS.length] } }); break;
    case 'edit-area': { const r = getArea(id); if (r) openSheet('area', { id, work:{ name:areaName(r), description:r.description || '', color:areaColor(r) } }); break; }
    case 'settings': openSheet('settings'); break;
    case 'goal': openSheet('goal', { value:weeklyGoal() }); break;
    case 'goal-step': S.sheet.value = Math.min(200, Math.max(1, S.sheet.value + +t.dataset.v)); $('#goal-v').textContent = S.sheet.value; break;
    case 'goal-save': saveConfig({ weeklyGoal:S.sheet.value }); closeSheet(); toast('Meta actualizada'); break;
    case 'export': exportData(); break;
    // sheet internals
    case 'close-sheet': closeSheet(); break;
    case 'f-area': readTaskForm(); S.sheet.work.repo = t.dataset.v || null; renderSheet(); break;
    case 'f-prio': readTaskForm(); S.sheet.work.priority = t.dataset.v || null; renderSheet(); break;
    case 'f-status': readTaskForm(); S.sheet.work.status = t.dataset.v; renderSheet(); break;
    case 'sub-toggle': { readTaskForm(); const c = S.sheet.work.checklist[+t.dataset.i]; c.done = !c.done; renderSheet(); break; }
    case 'sub-del': readTaskForm(); S.sheet.work.checklist.splice(+t.dataset.i, 1); renderSheet(); break;
    case 'a-color': S.sheet.work.name = $('#a-name').value; S.sheet.work.description = $('#a-desc').value; S.sheet.work.color = t.dataset.v; renderSheet(); break;
    case 'sheet-delete': {
      const sh = S.sheet;
      if (!sh.armed) { if (sh.kind === 'task') readTaskForm(); sh.armed = true; renderSheet(); break; }
      if (sh.kind === 'task') { closeSheet(); del('tasks', sh.id); toast('Tarea eliminada'); }
      else if (sh.kind === 'area') {
        const r = getArea(sh.id); closeSheet(); if (!r) break;
        S.tasks.filter(x => x.repo === sh.id).forEach(x => saveTask({ ...structuredClone(x), repo:null }));
        if (S.areaFilter === sh.id) S.areaFilter = '';
        del('repos', sh.id); toast(`Área “${areaName(r)}” eliminada`);
      }
      break;
    }
    case 'del-examples': {
      if (!S.sheet.armed) { S.sheet.armed = true; renderSheet(); break; }
      ['tasks', 'events', 'reminders'].forEach(col => { const ex = S[col].filter(x => x.example); S[col] = S[col].filter(x => !x.example); ex.forEach(x => store.del(col, x.id).catch(saveErr)); });
      closeSheet(); render(); toast('Datos de ejemplo eliminados');
      break;
    }
    // focus
    case 'focus': if (S.sheet) closeSheet(); openFocus(id); break;
    case 'focus-close': S.focus = null; renderFocus(); break;
    case 'focus-dur': S.focus.total = S.focus.remaining = +t.dataset.v * 60; renderFocus(); break;
    case 'focus-toggle': { const f = S.focus; if (f.running) { f.remaining = focusRemaining(); f.running = false; } else { if (f.remaining <= 0) f.remaining = f.total; f.endAt = Date.now() + f.remaining * 1000; f.running = true; } renderFocus(); break; }
    case 'focus-reset': { const f = S.focus; f.running = false; f.remaining = f.total; renderFocus(); break; }
    case 'focus-complete': { const f = S.focus; if (f.taskId) setStatus(f.taskId, 'done'); S.focus = null; renderFocus(); break; }
  }
});

/* ================= inputs & forms ================= */
let typeTimer = null;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'search') { S.search = el.value; clearTimeout(typeTimer); typeTimer = setTimeout(render, 140); }
  else if (el.id === 'set-name') { clearTimeout(typeTimer); typeTimer = setTimeout(() => saveConfig({ name:el.value.trim() }), 500); }
  else if (S.sheet && S.sheet.kind === 'task' && ['f-title', 'f-due', 'f-time'].includes(el.id)) { readTaskForm(); const s = $('#f-summary'); if (s) s.textContent = taskSummary(S.sheet.work); }
});
document.addEventListener('focusout', e => { if (e.target.id === 'search' && S.search.trim()) { rememberSearch(S.search); } });
document.addEventListener('change', e => { if (e.target.id === 'imp-file' && e.target.files && e.target.files[0]) importData(e.target.files[0]); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'f-sub') {
    e.preventDefault(); readTaskForm();
    const v = e.target.value.trim(); if (!v) return;
    S.sheet.work.checklist.push({ t:v, done:false }); renderSheet(); setTimeout(() => $('#f-sub')?.focus(), 0);
  } else if (e.key === 'Enter' && e.target.id === 'search') { rememberSearch(S.search); e.target.blur(); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form, sh = S.sheet;
  if (kind === 'task') {
    readTaskForm();
    const w = sh.work;
    if (!w.title.trim()) { sh.err = 'Escribe qué hay que hacer.'; renderSheet(); $('#f-title')?.focus(); return; }
    if (sh.id) {
      const prev = getTask(sh.id), n = { ...structuredClone(w), title:w.title.trim() };
      if (prev && prev.status !== 'done' && n.status === 'done') { n.closedAt = Date.now(); celebrate(); }
      if (n.status !== 'done') n.closedAt = null;
      saveTask(n); closeSheet(); toast('Cambios guardados');
    } else {
      const c = createTask(w); closeSheet();
      toast('Tarea agregada', { label:'Abrir', fn:() => openSheet('task', { id:c.id, work:structuredClone(getTask(c.id)) }) });
    }
  } else if (kind === 'event') {
    const d = Object.fromEntries(new FormData(f)); if (!d.title.trim()) return;
    put('events', { id:'e_' + rid(), title:d.title.trim(), date:d.date, start:d.start || null, end:d.end || null, location:(d.location || '').trim(), createdAt:Date.now() });
    S.selDay = d.date; closeSheet(); toast('Evento guardado');
  } else if (kind === 'rem') {
    const d = Object.fromEntries(new FormData(f)); if (!d.title.trim() || !d.at) return;
    put('reminders', { id:'r_' + rid(), title:d.title.trim(), at:d.at, done:false, createdAt:Date.now() });
    closeSheet(); toast('Recordatorio agregado');
  } else if (kind === 'area') {
    const name = $('#a-name').value.trim().replace(/\s+/g, ' ');
    sh.work.name = name; sh.work.description = $('#a-desc').value;
    if (!name) { sh.err = 'Escribe un nombre para el área.'; renderSheet(); return; }
    if (S.repos.some(r => areaKey(r) === slugify(name) && r.id !== sh.id)) { sh.err = `Ya tienes un área llamada “${name}”.`; renderSheet(); return; }
    const base = sh.id ? structuredClone(getArea(sh.id)) : { id:'rp_' + rid(), createdAt:Date.now() };
    put('repos', { ...base, name, slug:slugify(name), description:sh.work.description.trim(), color:COLORS.includes(sh.work.color) ? sh.work.color : 'gray', updatedAt:Date.now() });
    closeSheet(); toast(sh.id ? 'Área actualizada' : `Área “${name}” creada`);
  }
});

/* ================= keyboard ================= */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if (e.key === 'Escape') { if (S.focus) { S.focus = null; renderFocus(); return; } if (S.sheet) { closeSheet(); return; } if (typing) e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || S.sheet || S.focus) return;
  if (e.key === 'n' || e.key === 'c') { e.preventDefault(); openSheet('task', { work:newTaskWork() }); }
  else if (e.key === '/') { e.preventDefault(); go('tareas'); setTimeout(() => $('#search')?.focus(), 20); }
  else if (/^[1-4]$/.test(e.key)) go(VIEWS[+e.key - 1].id);
});

/* ================= drag & drop (board) ================= */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.trow[draggable]'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.trow'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col'); if (!col) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.col'); if (!col) return; e.preventDefault(); col.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) setStatus(id, col.dataset.col); });

/* ================= clock, reminders, day change ================= */
let lastDay = today(), lastGreet = greeting(new Date());
const fired = new Set();
function tick() {
  const now = new Date();
  if (today() !== lastDay) { lastDay = today(); S.selDay = null; render(); startGcalWatch(); }
  else if (greeting(now) !== lastGreet) { lastGreet = greeting(now); render(); }
  S.reminders.forEach(r => {
    if (r.done || fired.has(r.id)) return;
    const at = new Date(r.at);
    if (at <= now && now - at < 6 * 3600e3) { fired.add(r.id); toast(r.title, { label:'Hecho', fn:() => put('reminders', { ...structuredClone(r), done:true }) }, 'bell'); }
    else if (at <= now) fired.add(r.id);
  });
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); if (S.focus) renderFocus(); } });

/* ================= boot ================= */
const hash = (location.hash || '').slice(1);
if (VIEWS.some(v => v.id === hash)) S.view = hash;
render();

async function boot() {
  const cl = window.claude;
  let db = null, user = null;
  if (!STANDALONE) { try { [db, user] = await Promise.all([cl.use('db'), cl.use('user')]); } catch {} }
  let owner = false;
  if (user) {
    try { owner = await user.isOwner(); } catch {}
    try { const me = await user.me(); S.profileName = (me.name || '').split(' ')[0]; } catch {}
  }
  store = db && owner ? DbStore(db) : LocalStore();
  S.mode = store.kind;
  let pending = 5;
  const ready = () => { if (--pending === 0) tick(); };
  ['tasks', 'events', 'reminders'].forEach(col => {
    let first = true;
    store.subscribe(col, docs => { S[col] = docs; render(); if (first) { first = false; ready(); } });
  });
  let firstRepos = true;
  store.subscribe('repos', docs => { S.repos = docs; S.reposLoaded = true; render(); if (firstRepos) { firstRepos = false; ready(); } });
  let firstCfg = true;
  store.subscribeConfig(cfg => { if (cfg) S.config = { weeklyGoal:10, ...cfg, name:cfg.name || '' }; render(); if (firstCfg) { firstCfg = false; ready(); } });
  if (store.kind === 'db') {
    try { mcpNs = await cl.use('mcp'); } catch { mcpNs = null; }
    if (mcpNs) startGcalWatch();
  }
}
boot();
})();
</script>
